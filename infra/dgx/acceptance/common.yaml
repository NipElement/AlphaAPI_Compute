# Operator-only acceptance namespace: PSA privileged because the two-node
# NCCL job needs IPC_LOCK + the RDMA devices the Network Operator injects.
# NOT a tenant (no arise.ai/tier label): none of the tenant fences apply, so
# delete it when acceptance is done (scripts/hw-accept.sh offers --cleanup).
apiVersion: v1
kind: Namespace
metadata:
  name: hw-acceptance
  labels:
    project: arise-b300
    arise.ai/queue: arise-internal
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hw-allreduce
  namespace: hw-acceptance
  labels: { project: arise-b300 }
data:
  allreduce.py: |
    import os, sys, time, json, socket
    import torch, torch.distributed as dist
    import torch.multiprocessing as mp

    def worker(local_rank, nodes, node_rank, master, port, nbytes, iters, test):
        world = 8 * nodes
        rank = node_rank * 8 + local_rank
        torch.cuda.set_device(local_rank)
        dist.init_process_group("nccl", init_method=f"tcp://{master}:{port}", rank=rank, world_size=world)
        n = nbytes // 4
        x = torch.full((n,), float(rank + 1), device="cuda", dtype=torch.float32)
        for _ in range(5):
            dist.all_reduce(x.clone())
        torch.cuda.synchronize(); dist.barrier()
        t0 = time.perf_counter()
        for _ in range(iters):
            y = x.clone(); dist.all_reduce(y)
        torch.cuda.synchronize(); t = (time.perf_counter() - t0) / iters
        expected = float(world * (world + 1) / 2)
        ok = bool(torch.all(y == expected).item())
        algbw = nbytes / t / 1e9
        busbw = algbw * 2 * (world - 1) / world
        if rank == 0:
            props = [torch.cuda.get_device_properties(i) for i in range(torch.cuda.device_count())]
            print("HW_RESULT " + json.dumps({"test": test, "world": world, "nodes": nodes,
                  "bytes": nbytes, "iters": iters, "sec_per_iter": t, "algbw_gbps": round(algbw, 1),
                  "busbw_gbps": round(busbw, 1), "correct": ok, "gpus_per_node": torch.cuda.device_count(),
                  "gpu": props[0].name if props else None,
                  "hbm_gib": [round(p.total_memory / 2**30) for p in props],
                  "torch": torch.__version__, "nccl": ".".join(map(str, torch.cuda.nccl.version())),
                  "host": socket.gethostname()}), flush=True)
        dist.destroy_process_group()

    if __name__ == "__main__":
        task = os.environ.get("VC_TASK_NAME", "worker").upper()
        hosts = os.environ.get(f"VC_{task}_HOSTS", "").split(",")
        nodes = int(os.environ.get(f"VC_{task}_NUM", "1"))
        node_rank = int(os.environ.get("VK_TASK_INDEX", "0"))
        master = hosts[0] if hosts and hosts[0] else "127.0.0.1"
        nbytes = int(os.environ.get("ALLREDUCE_BYTES", "1073741824"))
        iters = int(os.environ.get("ALLREDUCE_ITERS", "20"))
        test = os.environ.get("HW_TEST", "nvlink-1node")
        if torch.cuda.device_count() != 8:
            print("HW_RESULT " + json.dumps({"test": test, "correct": False,
                  "error": f"expected 8 GPUs, torch sees {torch.cuda.device_count()}"}), flush=True)
            sys.exit(2)
        mp.spawn(worker, args=(nodes, node_rank, master, 29500, nbytes, iters, test), nprocs=8, join=True)
