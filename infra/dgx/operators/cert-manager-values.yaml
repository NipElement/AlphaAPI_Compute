# cert-manager Helm values — Day-0 step 12 (with the edge).
#   helm repo add jetstack https://charts.jetstack.io
#   helm install cert-manager jetstack/cert-manager --version $CERT_MANAGER_VERSION \   # = versions.env
#     -n cert-manager --create-namespace -f cert-manager-values.yaml
# Images digest-pinned (resolved 2026-08-27 from quay.io) so the chart cannot
# drift what actually runs; the chart version pins the CRDs.
crds:
  enabled: true
image:
  repository: quay.io/jetstack/cert-manager-controller
  digest: sha256:9339837eaaa7852509fa4c89c12543721d79d7facf57f29adec7c96fffe408d6
webhook:
  image:
    repository: quay.io/jetstack/cert-manager-webhook
    digest: sha256:2933ec670a99524a6860f641ef3720289d784b0bef35bd0b74fc3eb093e71596
  nodeSelector: { node-role.kubernetes.io/control-plane: "" }
  tolerations: [{ key: node-role.kubernetes.io/control-plane, effect: NoSchedule }]
cainjector:
  image:
    repository: quay.io/jetstack/cert-manager-cainjector
    digest: sha256:a8319ee78e94abb11c4fe0b35197a57848ae7eec6c526e369187dc57b2961116
  nodeSelector: { node-role.kubernetes.io/control-plane: "" }
  tolerations: [{ key: node-role.kubernetes.io/control-plane, effect: NoSchedule }]
# The two images the chart also runs (audit 2026-08-27: neither was pinned nor
# mirrored, and startupapicheck had no head-node placement).
acmesolver:
  image:
    repository: quay.io/jetstack/cert-manager-acmesolver
    digest: sha256:a076f72f33a22dfd3a23727f1e1a069817819406b39e5b0fd9cb97d3338cb8d8
startupapicheck:
  image:
    repository: quay.io/jetstack/cert-manager-startupapicheck
    digest: sha256:ac8ef0a934ae456d10d2ff5ee492b0a816bf55752f61354bde1739054c2c2c68
  nodeSelector: { node-role.kubernetes.io/control-plane: "" }
  tolerations: [{ key: node-role.kubernetes.io/control-plane, effect: NoSchedule }]
# Control-plane placement, like every other platform component. One block per
# component — YAML "last key wins", and a second `webhook:` further down used
# to silently DROP the digest pins above (review 2026-08-27 P1-4).
nodeSelector: { node-role.kubernetes.io/control-plane: "" }
tolerations: [{ key: node-role.kubernetes.io/control-plane, effect: NoSchedule }]
