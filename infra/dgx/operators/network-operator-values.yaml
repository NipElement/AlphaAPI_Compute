# ============================================================================
# NVIDIA Network Operator — Helm values, Day-0 step 8.
#
# Chart pinned in versions.env (NETWORK_OPERATOR_VERSION_REFERENCE=v26.4.0).
# ONLY keys the v26.4.0 chart reads live here (audit 2026-08-27 rendered the
# chart: the earlier ofedDriver/rdmaSharedDevicePlugin/sriovDevicePlugin/
# nvIpam toggles were NOT chart values and were silently ignored). The fabric
# components are configured by the NicClusterPolicy CR in
# nic-cluster-policy.yaml — apply it AFTER the operator is up.
#
#   helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
#   helm install network-operator nvidia/network-operator --version v26.4.0 \
#     -n nvidia-network-operator --create-namespace -f network-operator-values.yaml
#   kubectl apply -f nic-cluster-policy.yaml        # after filling ⟪DECIDE⟫
#
# Images: the operator's own image is pulled by tag (its template has no
# digest form) and is pinned by the registry mirror against
# operator-images.lock (digest equality verified; DGX-32 checks the running
# digest); every NicClusterPolicy component is pinned by digest in
# nic-cluster-policy.yaml (`make validate` 16/16). Adding a component to the
# CR = run `make operator-images-resolve`, then pin what check names.
# ============================================================================
# The GPU Operator (step 7) already runs Node Feature Discovery; a second NFD
# (two masters writing node labels, two worker DaemonSets per node) is what
# NVIDIA's docs tell you to avoid.
nfd:
  enabled: false

operator:
  # Control-plane placement, like every other platform controller: the head
  # node, never a sellable GPU node.
  nodeSelector: { node-role.kubernetes.io/control-plane: "" }
  tolerations:
    - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
  resources: {}
