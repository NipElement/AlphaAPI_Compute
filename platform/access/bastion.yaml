apiVersion: v1
kind: Namespace
metadata:
  name: access-system
  labels:
    project: arise-b300
    # privileged ONLY for hostPort 2222; platform/base/privileged-namespaces-policy.yaml
    # (arise-privileged-namespace-envelope) admits nothing else here and only
    # pods created through the Deployment.
    pod-security.kubernetes.io/enforce: privileged # DGX hostPort, no hostNetwork
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: tenant-bastion-host-keys, namespace: access-system }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: arise-longterm
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tenant-bastion, namespace: access-system }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: tenant-bastion } }
  template:
    metadata: { labels: { app.kubernetes.io/name: tenant-bastion } }
    spec:
      automountServiceAccountToken: false
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 15
      containers:
        - name: ssh
          image: DEVBOX_IMAGE_PLACEHOLDER
          command: [python3, -u, /etc/arise/access/entrypoint.py]
          env: [{ name: PYTHONDONTWRITEBYTECODE, value: "1" }]
          ports: [{ name: ssh, containerPort: 2222 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 64Mi, ephemeral-storage: 10Mi }
            limits: { cpu: "1", memory: 512Mi, ephemeral-storage: 100Mi }
          readinessProbe:
            exec: { command: [test, -f, /run/access-slots/ready] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [test, -f, /run/access-slots/ready] }
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - { name: code, mountPath: /etc/arise/access, readOnly: true }
            # Bind the FILE beneath a root-owned image directory. A whole
            # ConfigMap directory acquires fsGroup group-write bits, which
            # sshd StrictModes correctly refuses. Hash rollouts refresh subPath.
            - { name: access-keys, mountPath: /etc/arise/access-keys/authorized_keys, subPath: authorized_keys, readOnly: true }
            - { name: host-keys, mountPath: /keys }
            - { name: runtime, mountPath: /run/access-slots }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: code
          configMap: { name: tenant-bastion-code }
        - name: access-keys
          configMap: { name: tenant-bastion-access-keys, defaultMode: 420 }
        - name: host-keys
          persistentVolumeClaim: { claimName: tenant-bastion-host-keys }
        - name: runtime
          emptyDir: { sizeLimit: 10Mi }
        - name: tmp
          emptyDir: { sizeLimit: 10Mi }
---
apiVersion: v1
kind: Service
metadata: { name: tenant-bastion, namespace: access-system }
spec:
  selector: { app.kubernetes.io/name: tenant-bastion }
  ports: [{ name: ssh, port: 2222, targetPort: 2222 }]
