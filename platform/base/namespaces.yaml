# ============================================================================
# Namespaces + Pod Security Admission (plan §7.6)
#
# PSA is stable since Kubernetes v1.25 and is applied per-namespace via labels
# with independent enforce / audit / warn levels (plan §7.6 citation [13]).
#
# Design rule that the tests assert (SEC-01):
#   the ONLY namespace allowed to run privileged workloads is platform-system,
#   and it earns that solely to host the simulated device plugin DaemonSet.
#   Tenant namespaces are 'restricted' with no exception path.
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    arise.ai/tier: platform
    project: arise-b300-prelab
    # privileged: required by the fake-GPU DaemonSet (kubelet device-plugin socket).
    # Compensated by strict RBAC in rbac.yaml — no tenant SA can create here.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    arise.ai/tier: platform
    project: arise-b300-prelab
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-arise
  labels:
    arise.ai/tier: tenant
    arise.ai/tenant: arise
    project: arise-b300-prelab
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-direct
  labels:
    arise.ai/tier: tenant
    arise.ai/tenant: direct
    project: arise-b300-prelab
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: vast-mock
  labels:
    arise.ai/tier: mock
    project: arise-b300-prelab
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-system
  labels:
    arise.ai/tier: test
    project: arise-b300-prelab
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
