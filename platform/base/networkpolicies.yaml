# --------------------------------- vast-mock --------------------------------
# The mock accepts calls ONLY from the capacity controller in platform-system.
# It must never be reachable from tenants, and must never egress anywhere:
# that is the structural guarantee behind VST-06 "真实 VAST 端点不可达".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: vast-mock
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-controller-ingress-only
  namespace: vast-mock
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vast-mock
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: capacity-controller
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: test-system
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-only-egress
  namespace: vast-mock
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ---------------------------- platform-system -------------------------------
# Defense-in-depth ingress fence for the internal platform services. Layer 1
# (the tenant deny-imds pod-CIDR except above) already stops tenants at their
# own egress; this is the destination-side belt-and-braces so a compromised
# NON-tenant pod still cannot drive the unauthenticated internal surfaces
# (tenant-portal ?ns=, ops-console /transition, the fake-gpu-plugin /unhealthy
# fault API). The gateway is deliberately EXCLUDED: it serves external users
# over a hostPort and must keep accepting node-sourced ingress.
#
# ⚠ Same CNI caveat as the top of this file: enforcement AND the kubelet-probe
# exemption are kindnetd-dependent. This policy was applied and VERIFIED live
# on 2026-08-16 to keep every targeted pod Ready (probes on :8080 survived) and
# the tenant->portal path blocked; if a future kindnetd rev breaks probes under
# it, the remedy is the disableDefaultCNI path, NOT deleting the policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-internal-ingress
  namespace: platform-system
  labels:
    project: arise-b300-prelab
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [platform-gateway]      # gateway needs external (host) ingress
  policyTypes: [Ingress]
  ingress:
    - from:
        # Every namespace EXCEPT the two tenant namespaces: platform-system
        # (gateway->portal/console, advertiser->plugin), monitoring (scrape),
        # test-system (SEC-05 harness), volcano-system, kube-system. Tenants
        # are the only source excluded — that is the entire purpose.
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values: [tenant-arise, tenant-direct]
