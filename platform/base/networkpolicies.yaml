# ============================================================================
# NetworkPolicy — default-deny per tenant namespace (plan §3.2, SEC-05)
#
# ⚠ ENFORCEMENT CAVEAT — READ BEFORE MARKING SEC-05 AS PASS ⚠
# A NetworkPolicy object existing is NOT evidence that it is enforced. Whether
# these take effect depends entirely on the CNI. kind's built-in kindnetd has
# historically NOT implemented NetworkPolicy; if that is the case here, every
# policy below is inert and a "kubectl get networkpolicy" screenshot would be
# a FALSE PASS.
#
# Therefore tests/sec-05-networkpolicy.sh probes enforcement EMPIRICALLY
# (actually attempts a connection that must fail). SEC-05 may only be recorded
# PASS on the strength of that probe. If the probe shows no enforcement, the
# correct action is to recreate the cluster with `disableDefaultCNI: true` and
# install a policy-capable CNI — NOT to relax the test.
# ============================================================================

# ------------------------------- tenant-arise -------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tenant-arise
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tenant-arise
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Explicitly deny the instance metadata endpoint. Plan §3.2 forbids tenant
# access to IMDS. On this host that matters more than usual: IMDS is the only
# thing standing between a pod and instance-scoped credentials.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-imds-and-host-links
  namespace: tenant-arise
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16      # IMDS + link-local (incl. 169.254.169.254)
              - 172.31.0.0/16       # host VPC — tenants have no business here
              - 10.96.0.0/12        # service CIDR, reachable only via allow rules
              - 10.244.0.0/16       # POD CIDR — tenants reach the platform ONLY
                                    # through the gateway, never pod-to-pod. Without
                                    # this a tenant pod could hit the internal APIs
                                    # (tenant-portal ?ns=<other>, ops-console, and
                                    # the fake-gpu-plugin admin :8080 fault surface)
                                    # by pod IP, bypassing gateway auth entirely.
---
