---
# ---------------------------- platform-system -------------------------------
# The portal, console and meter use narrower dedicated policies below.
# Defense-in-depth ingress fence for the internal platform services. Layer 1
# (the tenant deny-imds pod-CIDR except above) already stops tenants at their
# own egress; this is the destination-side belt-and-braces so a compromised
# NON-tenant pod still cannot drive the unauthenticated internal surfaces
# (tenant-portal ?ns=, ops-console /transition, the fake-gpu-plugin /unhealthy
# fault API). The gateway is deliberately EXCLUDED: it serves external users
# over a hostPort and must keep accepting node-sourced ingress.
#
# ⚠ Same CNI caveat as the top of this file: enforcement AND the kubelet-probe
# exemption are kindnetd-dependent. This policy was applied and VERIFIED live
# on 2026-08-16 to keep every targeted pod Ready (probes on :8080 survived) and
# the tenant->portal path blocked; if a future kindnetd rev breaks probes under
# it, the remedy is the disableDefaultCNI path, NOT deleting the policy.
#
# ⚠ DGX: that verification does NOT transfer. Kubelet probes originate in the
# node's host netns; whether they pass a namespaceSelector'd ingress policy is
# a CNI implementation choice, and the dgx CNI is chosen at Day-0. A strictly
# conforming CNI without a probe exemption would mark every policy-selected
# platform pod NotReady, emptying the Services behind the gateway's proxies.
# Day-0 runbook therefore RE-VERIFIES under the chosen CNI: apply, then assert
# tenant-portal / ops-console / capacity-controller reach Ready and the
# tenant->portal pod-IP path stays blocked (docs/production-readiness.md §3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-internal-ingress
  namespace: platform-system
  labels:
    project: arise-b300-prelab
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [platform-gateway, tenant-portal, ops-console, metering]      # gateway needs external (host) ingress
  policyTypes: [Ingress]
  ingress:
    - from:
        # Every namespace EXCEPT tenant ones: platform-system
        # (advertiser->plugin), monitoring (scrape),
        # test-system (SEC-05 harness), volcano-system, kube-system. Tenants
        # are the only source excluded — that is the entire purpose.
        #
        # Keyed on the TIER LABEL first (2026-08-27). The name list alone was
        # FAIL-OPEN for growth: onboarding a third tenant creates a namespace
        # that is not in any enumerated list, so it would have been allowed to
        # reach tenant-portal / ops-console directly by pod IP and bypass the
        # gateway's authentication entirely. The label is the same one every
        # admission binding already selects on, so a tenant namespace without
        # it is broken in several visible ways rather than silently unfenced.
        #
        # Both expressions must hold (matchExpressions AND within one
        # selector): the label is the rule, the name list is the belt that
        # keeps the two rehearsed tenants excluded even if their label is ever
        # stripped. NotIn also matches namespaces that lack the key at all —
        # which is exactly right for platform-system, monitoring, kube-system.
        - namespaceSelector:
            matchExpressions:
              - key: arise.ai/tier
                operator: NotIn
                values: [tenant]
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values: [tenant-arise, tenant-direct]

---
# These mutation APIs accept identity only from the authenticated gateway.
# Other platform namespaces (including a newly created non-tenant namespace)
# no longer inherit permission to bypass that authentication boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: platform-api-ingress, namespace: platform-system }
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [tenant-portal, ops-console]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: platform-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: platform-gateway }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: metering-api-ingress, namespace: platform-system }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: metering }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: platform-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: tenant-portal }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
          podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports: [{ protocol: TCP, port: 8080 }]
