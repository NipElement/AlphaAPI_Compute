# ============================================================================
# RBAC (plan §7.6, SEC-06 "租户不可读 secrets/nodes/其他 namespace")
#
# Two principals (the lab-only fake-gpu-plugin identity moved to
# overlays/lab/lab-simulation-identity.yaml on 2026-08-26 — base is what BOTH
# overlays share, and simulation RBAC must never reach hardware):
#   1. capacity-controller  — the ONLY identity permitted to write node labels
#                             and taints, and to update NodeOwnership status.
#   2. tenant-*             — namespaced, deliberately cannot read Secrets,
#                             Nodes, or anything cross-namespace.
#
# SEC-06 asserts each denial with `kubectl auth can-i --as=<sa>`; the expected
# answer for every cell in the tenant matrix is "no".
# ============================================================================

# --------------------------- capacity-controller ---------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capacity-controller
  namespace: platform-system
  labels:
    app.kubernetes.io/name: capacity-controller
    project: arise-b300-prelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arise:capacity-controller
rules:
  # Owns the desired-state CRD.
  - apiGroups: ["infrastructure.arise.ai"]
    resources: ["nodeownerships"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["infrastructure.arise.ai"]
    resources: ["nodeownerships/status", "nodeownerships/finalizers"]
    verbs: ["get", "update", "patch"]
  # Node labels + taints are the enforcement surface of the owner invariant.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Drain: needs to see and evict pods, and respect PDBs.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # Ownership handover gates on node-pinned tenant volumes (2026-08-26): a
  # node cannot be reserved for a DIRECT customer, listed on a marketplace, or
  # returned to the ARISE pool while another tenant's local volumes still sit
  # on its NVMe — the volume would be both stranded for its owner (nodeAffinity
  # pins it behind a taint the owner may not tolerate) and physically present
  # on hardware someone else is paying for. Read-only: the controller reports
  # and blocks; deleting volumes stays a human decision.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  # Read-only, and load-bearing: the drain and volume gates take the UNION of
  # the mounted register and the namespaces LABELLED arise.ai/tier=tenant, so
  # a tenant onboarded after this process started still gets drained off a
  # node that is changing hands (2026-08-31). Without this grant the union
  # degrades to the register alone and the controller says so in its log.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # NO poddisruptionbudgets grant (2026-08-30): the controller never reads a
  # PDB object — it calls the eviction subresource and handles the 429 the API
  # SERVER returns when a budget would be violated (capacity_controller.py
  # ~:458). The old grant was dead privilege carrying a comment ("respect
  # PDBs") that implied client-side logic which does not exist.
  # Audit trail.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # NOTE (2026-08-27): configmaps and leases moved to a NAMESPACED Role below.
  # A cluster-wide configmaps grant on the identity that also writes node
  # labels would let a compromised controller read every namespace's
  # ConfigMaps (tenants' authorized_keys included) and rewrite the platform's
  # own code ConfigMaps — it only ever needs its state CM in platform-system.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arise:capacity-controller-state
  namespace: platform-system
rules:
  # Persistent transition state (idempotency keys — OWN-04, OWN-07, VST-04):
  # exactly one ConfigMap, in exactly this namespace.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # NO leases grant (2026-08-30): it was here for "leader election" that is
  # not implemented — grep the controller for `lease` and there is nothing.
  # An unused grant is attack surface plus a claim of HA the code does not
  # make. What actually keeps exactly one reconciler is replicas: 1 +
  # strategy: Recreate (asserted by DGX-36); add this back the day leader
  # election is written, not before.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arise:capacity-controller-state
  namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arise:capacity-controller-state
subjects:
  - kind: ServiceAccount
    name: capacity-controller
    namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arise:capacity-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: arise:capacity-controller
subjects:
  - kind: ServiceAccount
    name: capacity-controller
    namespace: platform-system
---
# ------------------------------ tenant identities ---------------------------
# The namespace `default` ServiceAccount: NO token in tenant pods. Even the
# unprivileged discovery roles are a live bearer credential to the API server
# (review 2026-08-27 P2-5). The portal also opts every pod out per-spec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tenant-arise
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tenant-direct
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-runner
  namespace: tenant-arise
  labels:
    project: arise-b300-prelab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-runner
  namespace: tenant-direct
  labels:
    project: arise-b300-prelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arise:tenant-runner
  namespace: tenant-arise
rules:
  # Enough to run and observe own workloads. Nothing more.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["scheduling.volcano.sh"]
    resources: ["podgroups"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # NOTE the absences, each asserted by SEC-06:
  #   no "secrets", no "configmaps" write, no "nodes", no "persistentvolumes",
  #   no cross-namespace scope (this is a Role, not a ClusterRole).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arise:tenant-runner
  namespace: tenant-arise
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arise:tenant-runner
subjects:
  - kind: ServiceAccount
    name: tenant-runner
    namespace: tenant-arise
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arise:tenant-runner
  namespace: tenant-direct
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["scheduling.volcano.sh"]
    resources: ["podgroups"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arise:tenant-runner
  namespace: tenant-direct
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arise:tenant-runner
subjects:
  - kind: ServiceAccount
    name: tenant-runner
    namespace: tenant-direct
