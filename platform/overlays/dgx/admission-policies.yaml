# ============================================================================
# DGX overlay admission policies — the MIRROR IMAGE of the lab overlay.
#
# In the lab we forbid nvidia.com/gpu because it does not exist and a request
# for it must never appear to succeed. On real hardware the danger inverts:
# `arise.dev/fake-gpu` must never appear, because a workload that asks for a
# simulated resource and gets scheduled would be running on real, billable,
# contractually-committed GPUs while believing it is in a sandbox.
#
# Plan §8.2 "生产防误用: production overlay 删除该 DaemonSet；准入策略拒绝
# arise.dev/fake-gpu". Deleting the DaemonSet stops the resource being
# advertised; this policy stops anything asking for it even if a stale
# advertiser were somehow reintroduced. Two independent mechanisms, because
# one of them will eventually be misconfigured.
# ============================================================================
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arise-deny-simulated-gpu
  labels:
    project: arise-b300
    arise.ai/overlay: dgx
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !object.spec.containers.exists(c,
          has(c.resources) && (
            (has(c.resources.requests) && 'arise.dev/fake-gpu' in c.resources.requests) ||
            (has(c.resources.limits)   && 'arise.dev/fake-gpu' in c.resources.limits)
          ))
      message: >-
        arise.dev/fake-gpu is a SIMULATION resource and must never be requested
        on DGX hardware. This cluster has real GPUs under real contracts. Use
        nvidia.com/gpu. If you meant to run in the prelab, you are on the wrong
        cluster.
      reason: Forbidden
    - expression: >-
        !has(object.spec.initContainers) ||
        !object.spec.initContainers.exists(c,
          has(c.resources) && (
            (has(c.resources.requests) && 'arise.dev/fake-gpu' in c.resources.requests) ||
            (has(c.resources.limits)   && 'arise.dev/fake-gpu' in c.resources.limits)
          ))
      message: arise.dev/fake-gpu is forbidden in initContainers on DGX hardware.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arise-deny-simulated-gpu
spec:
  policyName: arise-deny-simulated-gpu
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
---
# The ownership gate is SEMANTICALLY IDENTICAL to the lab's (SCH-04) — ported
# expression-for-expression on 2026-08-26 after review caught that an earlier
# dgx copy hardcoded ARISE for every tenant, which would have DENIED the paying
# DIRECT customer's nodeSelector arise.ai/owner=DIRECT — the whole-node
# reservation this overlay exists to sell (DIR-01, gaps.md §7 option B).
# scripts/dgx-render-check.sh asserts the DIRECT branch is present so the two
# overlays cannot silently diverge again. Only the label differs.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arise-tenant-owner-gate
  labels:
    project: arise-b300
    arise.ai/overlay: dgx
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: selector
      expression: >-
        has(object.spec.nodeSelector) ? object.spec.nodeSelector : {}
    # Each tenant namespace has exactly one owner class it may target.
    # A whole-node customer exists precisely to run on DIRECT-reserved nodes:
    # that reservation IS the capacity guarantee (runbooks/gaps.md §7, option
    # B), so forbidding it here would lock customers out of what they pay for.
    #
    # Driven by the NAMESPACE LABEL, which platform/tenants.yaml generates
    # (scripts/onboard-tenant.py) — the same pattern the queue binding and the
    # suspension gate already use. It was `request.namespace == 'tenant-direct'`
    # until 2026-09-01, which meant the SECOND whole-node customer — the
    # $52,750/month flagship product — could not target the node reserved for
    # them, and their pods would silently fall back to the shared ARISE pool.
    # The register already carried `owner:` per tenant; only this rule ignored it.
    #
    # The name test survives as a BELT for a namespace that predates the label,
    # so labelling and policy can land in either order without a window where a
    # paying customer's pods are refused.
    - name: allowedOwner
      expression: >-
        (has(namespaceObject.metadata.labels) &&
         'arise.ai/owner' in namespaceObject.metadata.labels)
          ? namespaceObject.metadata.labels['arise.ai/owner']
          : (request.namespace == 'tenant-direct' ? 'DIRECT' : 'ARISE')
  validations:
    # DIRECT is a commercial class, not a tenant identity. Every workload
    # that can tolerate a dedicated node must also select its OWN namespace.
    # nodeAffinity cannot broaden a required nodeSelector.
    - expression: >-
        !('arise.ai/tenant' in variables.selector) ||
        variables.selector['arise.ai/tenant'] == request.namespace
      message: A workload may not select another tenant's reserved node.
      reason: Forbidden
    - expression: >-
        !has(object.spec.tolerations) ||
        !object.spec.tolerations.exists(t, has(t.key) && t.key == 'arise.ai/direct-owned') ||
        ('arise.ai/tenant' in variables.selector &&
         variables.selector['arise.ai/tenant'] == request.namespace &&
         'arise.ai/owner' in variables.selector && variables.selector['arise.ai/owner'] == 'DIRECT')
      message: Dedicated workloads must select arise.ai/owner=DIRECT and arise.ai/tenant equal to their namespace.
      reason: Forbidden
    - expression: >-
        !('arise.ai/owner' in variables.selector) ||
        variables.selector['arise.ai/owner'] == variables.allowedOwner
      messageExpression: >-
        'workloads in ' + request.namespace + ' may only target nodes with ' +
        'arise.ai/owner=' + variables.allowedOwner + '. Any other owner class ' +
        'is committed elsewhere and scheduling onto it would create dual ownership.'
      reason: Forbidden
    # A VAST-owned node is off limits to every tenant without exception: it is
    # serving, or about to serve, a marketplace customer outside this cluster.
    - expression: >-
        !('arise.ai/owner' in variables.selector) ||
        variables.selector['arise.ai/owner'] != 'VAST'
      message: >-
        No Kubernetes tenant may target a VAST-owned node. That machine is
        rented through the marketplace and is not ours to schedule.
      reason: Forbidden
    # Pinning by nodeName bypasses the scheduler and therefore every taint.
    - expression: "!has(object.spec.nodeName) || object.spec.nodeName == ''"
      message: >-
        spec.nodeName pinning is not permitted for tenant workloads; it
        bypasses taints and the ownership gate. Use nodeSelector.
      reason: Forbidden
    # The nodeSelector checks above only inspect spec.nodeSelector, so a pod
    # could target a VAST/transition/other-owner node by nodeAffinity instead.
    # That is caught HERE, at the taint layer, which is airtight regardless of
    # how the node is targeted: every owner/transition taint is arise.ai/*.
    # The ONE legitimate exception is a DIRECT-class tenant tolerating
    # arise.ai/direct-owned — exactly what lets a whole-node customer land on
    # the node reserved for it. Everything else, including a keyless catch-all
    # toleration, is denied. Keyed on the tenant's owner CLASS (above), not on
    # one namespace name: hardcoding the name here blocked every whole-node
    # customer after the first, in the same breath as the selector rule
    # (2026-09-01).
    - expression: >-
        !has(object.spec.tolerations) ||
        object.spec.tolerations.all(t,
          has(t.key) && (
            !t.key.startsWith('arise.ai/') ||
            (variables.allowedOwner == 'DIRECT' &&
             t.key == 'arise.ai/direct-owned')
          ))
      message: >-
        Tenant workloads may not tolerate arise.ai/* taints (nor carry a keyless
        catch-all toleration). The only exception is a tenant-direct workload
        tolerating arise.ai/direct-owned, its own reserved-node taint. On this
        cluster those taints fence live customer contracts; tolerating any other
        one to reach a node via nodeAffinity is a contract breach. Remove it.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arise-tenant-owner-gate
spec:
  policyName: arise-tenant-owner-gate
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        arise.ai/tier: tenant
---
# ---------------------------------------------------------------- SEC-02 ---
# Ported verbatim from the lab (only the label differs). PSA already enforces
# 'restricted' on tenant namespaces; this policy exists as the SECOND
# independent mechanism (the overlay's own doctrine, above) and produces an
# explicit, greppable denial event naming the exact field. On hardware the
# hostPath denial matters most: the root filesystem belongs to us, the tenant
# does not.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arise-tenant-host-isolation
  labels:
    project: arise-b300
    arise.ai/overlay: dgx
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: "!has(object.spec.hostNetwork) || object.spec.hostNetwork == false"
      message: hostNetwork is forbidden for tenant workloads.
      reason: Forbidden
    - expression: "!has(object.spec.hostPID) || object.spec.hostPID == false"
      message: hostPID is forbidden for tenant workloads.
      reason: Forbidden
    - expression: "!has(object.spec.hostIPC) || object.spec.hostIPC == false"
      message: hostIPC is forbidden for tenant workloads.
      reason: Forbidden
    - expression: >-
        !has(object.spec.volumes) ||
        !object.spec.volumes.exists(v, has(v.hostPath))
      message: >-
        hostPath volumes are forbidden for tenant workloads. A hostPath mount
        on this cluster is a direct path to the node OS and to other tenants'
        NVMe data.
      reason: Forbidden
    - expression: >-
        !object.spec.containers.exists(c,
          has(c.securityContext) &&
          has(c.securityContext.privileged) &&
          c.securityContext.privileged == true)
      message: privileged containers are forbidden for tenant workloads.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arise-tenant-host-isolation
spec:
  policyName: arise-tenant-host-isolation
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        arise.ai/tier: tenant
---
# ---------------------------------------------------------------- SUS-01 ---
# The freeze lever for a non-paying (or breaching) tenant. The DECISION of
# when to freeze is commercial (D6); the LEVER must exist before the first
# invoice is late. One label on the namespace — arise.ai/suspended=true — and
# the API server refuses every NEW workload there with a message that names
# the reason. Running pods are untouched by this policy: stopping them is the
# runbook's explicit second step after the grace period, never a side effect
# of a label (runbooks/tenant-freeze.md). Only an admin can label a namespace
# (no tenant identity has any verb on namespaces, SEC-06).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arise-tenant-suspended
  labels:
    project: arise-b300
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods", "persistentvolumeclaims", "services"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["deployments"]
      - apiGroups: ["batch.volcano.sh"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["jobs"]
      - apiGroups: ["scheduling.volcano.sh"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE"]
        resources: ["podgroups"]
  variables:
    - name: suspended
      expression: >-
        has(namespaceObject.metadata.labels) &&
        'arise.ai/suspended' in namespaceObject.metadata.labels &&
        namespaceObject.metadata.labels['arise.ai/suspended'] == 'true'
  validations:
    - expression: "!variables.suspended"
      messageExpression: >-
        'namespace ' + request.namespace + ' is SUSPENDED (arise.ai/suspended=true): ' +
        'no new workloads are accepted until the account is restored. ' +
        'Contact ARISE support.'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arise-tenant-suspended
spec:
  policyName: arise-tenant-suspended
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        arise.ai/tier: tenant
