# ============================================================================
# DGX overlay admission policies — the MIRROR IMAGE of the lab overlay.
#
# In the lab we forbid nvidia.com/gpu because it does not exist and a request
# for it must never appear to succeed. On real hardware the danger inverts:
# `arise.dev/fake-gpu` must never appear, because a workload that asks for a
# simulated resource and gets scheduled would be running on real, billable,
# contractually-committed GPUs while believing it is in a sandbox.
#
# Plan §8.2 "生产防误用: production overlay 删除该 DaemonSet；准入策略拒绝
# arise.dev/fake-gpu". Deleting the DaemonSet stops the resource being
# advertised; this policy stops anything asking for it even if a stale
# advertiser were somehow reintroduced. Two independent mechanisms, because
# one of them will eventually be misconfigured.
# ============================================================================
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arise-deny-simulated-gpu
  labels:
    project: arise-b300
    arise.ai/overlay: dgx
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !object.spec.containers.exists(c,
          has(c.resources) && (
            (has(c.resources.requests) && 'arise.dev/fake-gpu' in c.resources.requests) ||
            (has(c.resources.limits)   && 'arise.dev/fake-gpu' in c.resources.limits)
          ))
      message: >-
        arise.dev/fake-gpu is a SIMULATION resource and must never be requested
        on DGX hardware. This cluster has real GPUs under real contracts. Use
        nvidia.com/gpu. If you meant to run in the prelab, you are on the wrong
        cluster.
      reason: Forbidden
    - expression: >-
        !has(object.spec.initContainers) ||
        !object.spec.initContainers.exists(c,
          has(c.resources) && (
            (has(c.resources.requests) && 'arise.dev/fake-gpu' in c.resources.requests) ||
            (has(c.resources.limits)   && 'arise.dev/fake-gpu' in c.resources.limits)
          ))
      message: arise.dev/fake-gpu is forbidden in initContainers on DGX hardware.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arise-deny-simulated-gpu
spec:
  policyName: arise-deny-simulated-gpu
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
---
# The ownership gate is IDENTICAL to the lab's, by design. It is one of the
# few things that transfers unchanged from CPU rehearsal to hardware (plan
# §13.1 "可直接复用: RBAC、PSA、quota、queue、状态机 CRD"), and it is the
# reason the rehearsal was worth doing at all.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arise-tenant-owner-gate
  labels:
    project: arise-b300
    arise.ai/overlay: dgx
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: selector
      expression: "has(object.spec.nodeSelector) ? object.spec.nodeSelector : {}"
  validations:
    - expression: >-
        !('arise.ai/owner' in variables.selector) ||
        variables.selector['arise.ai/owner'] == 'ARISE'
      message: >-
        Tenant workloads may only target nodes with arise.ai/owner=ARISE.
        On this cluster a VAST- or DIRECT-owned node is serving a live customer
        contract; scheduling onto it is a contract breach, not just a policy
        violation.
      reason: Forbidden
    - expression: "!has(object.spec.nodeName) || object.spec.nodeName == ''"
      message: >-
        spec.nodeName pinning bypasses taints and the ownership gate and is not
        permitted for tenant workloads.
      reason: Forbidden
    # nodeSelector alone is not enough: a pod could target a VAST/transition/
    # other-owner node via nodeAffinity. The airtight control is the taint layer
    # — every owner/transition taint is arise.ai/*. The one legitimate exception
    # is a tenant-direct workload tolerating arise.ai/direct-owned (its own
    # reserved-node taint, the DIRECT customer contract). Everything else,
    # including a keyless catch-all toleration, is denied.
    - expression: >-
        !has(object.spec.tolerations) ||
        object.spec.tolerations.all(t,
          has(t.key) && (
            !t.key.startsWith('arise.ai/') ||
            (request.namespace == 'tenant-direct' &&
             t.key == 'arise.ai/direct-owned')
          ))
      message: >-
        Tenant workloads may not tolerate arise.ai/* taints (nor carry a keyless
        catch-all toleration). The only exception is a tenant-direct workload
        tolerating arise.ai/direct-owned, its own reserved-node taint. On this
        cluster those taints fence live customer contracts; tolerating any other
        one to reach a node via nodeAffinity is a contract breach. Remove it.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arise-tenant-owner-gate
spec:
  policyName: arise-tenant-owner-gate
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        arise.ai/tier: tenant
