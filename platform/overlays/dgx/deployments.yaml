# ============================================================================
# Component workloads — DGX overlay.
#
# PORTED FROM overlays/lab/deployments.yaml, with the two SIMULATION components
# deliberately DROPPED:
#   - fake-gpu-advertiser: never advertise simulated capacity on real GPUs.
#   - vast-mock: this overlay talks to the real adapter under separate approval;
#     a fake marketplace living beside real contracts is a footgun.
# The lab's kustomization is the only place those two are produced; here only
# the capacity-controller — the NodeOwnership reconciler — carries over. It is
# hardware-independent: it enforces the owner state machine (ARISE/VAST/DIRECT)
# that fences live customer contracts, exactly as rehearsed on CPU.
#
# TWO env changes from the lab, both deliberate:
#   - FAKE_GPU_RESOURCE=nvidia.com/gpu: the controller uses this only to gate
#     drains/sanitize on "are any GPUs still allocated on this node?" On real
#     hardware that must look at nvidia.com/gpu, not the simulation resource.
#   - VAST_ADAPTER=none — the honest "no marketplace yet" mode. get() reports
#     the true day-0 state (nothing listed, zero marketplace contracts), so
#     ARISE<->DIRECT reservations — the transitions the day-0 product sells —
#     run the full rehearsed state machine. desired=VAST fails fast with an
#     explicit condition, and any node carrying VAST state is held, never
#     assumed contract-free (tests/unit_adapter_modes.py). Flipping to the
#     real marketplace is VST-06: a separate approval AND a code change,
#     never just this env.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-controller
  namespace: platform-system
  labels:
    app.kubernetes.io/name: capacity-controller
    project: arise-b300
spec:
  replicas: 1           # single writer; concurrency is serialized by design
  strategy:
    type: Recreate      # never two reconcilers racing on the same node
  selector:
    matchLabels:
      app.kubernetes.io/name: capacity-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capacity-controller
        project: arise-b300
    spec:
      serviceAccountName: capacity-controller
      # Keep the reconciler off the GPU workers, on the head/control-plane node
      # with the rest of the platform control plane (D1). It touches no GPU.
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: controller
          image: PYTHON_BASE_IMAGE_PLACEHOLDER
          command: ["python3", "-u", "/app/capacity_controller.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            # No VAST_API_BASE: with VAST_ADAPTER=none there is nothing to
            # dial, and pointing the var at a service that must not exist here
            # (vast-mock) would only mislead the next reader.
            - { name: VAST_ADAPTER, value: "none" }
            # Triple-disabled production adapter (VST-06): this flag, the
            # adapter's constructor guard, and the absence of any production
            # code path in the image. Do not flip without VST-06 sign-off.
            - { name: VAST_PRODUCTION_ADAPTER_ENABLED, value: "false" }
            # Drain-safety gate now looks at the REAL GPU resource.
            - { name: FAKE_GPU_RESOURCE, value: "nvidia.com/gpu" }
            - { name: RECONCILE_INTERVAL_SECONDS, value: "10" }
            - { name: DRAIN_TIMEOUT_SECONDS, value: "120" }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: tmp,  mountPath: /tmp }
            - { name: tenants, mountPath: /etc/arise, readOnly: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
      volumes:
        - name: code
          configMap: { name: capacity-controller-code }
        - name: tmp
          emptyDir: {}
        - name: tenants
          configMap: { name: platform-tenants, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: capacity-controller
  namespace: platform-system
  labels:
    app.kubernetes.io/name: capacity-controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: capacity-controller
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# ------------------------------------------------------------- metering ----
# The allocation ledger (services/metering/metering.py): the single writer of
# the append-only, hash-chained record every invoice derives from. Read-only
# against the API — it observes tenant pods, it never mutates anything.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metering
  namespace: platform-system
  labels: { app.kubernetes.io/name: metering, project: arise-b300 }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arise:metering
rules:
  # Exactly what the meter reads, nothing it could write: the pods it bills,
  # the claims it records as storage lines (2026-08-27) and the namespace
  # list it walks. No secrets, no nodes, no CRDs.
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arise:metering
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "arise:metering" }
subjects:
  - { kind: ServiceAccount, name: metering, namespace: platform-system }
---
# The ledger lives on a RETAINED volume: a claim deleted by accident must not
# take the only record of who used what with it.
# On dgx this binds through local-path on the HEAD node, so the head node
# needs /raid/arise/volumes/.raid-verified like every other node (Day-0
# step 9); without it the claim stays Pending and metering never starts —
# verify-dgx DGX-09 catches that. Head-node storage is decision D1.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metering-ledger
  namespace: platform-system
  labels: { app.kubernetes.io/name: metering, project: arise-b300 }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: arise-longterm
  resources:
    requests: { storage: 10Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metering
  namespace: platform-system
  labels: { app.kubernetes.io/name: metering, project: arise-b300 }
spec:
  replicas: 1                 # single writer of the ledger, by construction
  strategy: { type: Recreate }   # never two writers on one RWO volume
  selector: { matchLabels: { app.kubernetes.io/name: metering } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: metering, project: arise-b300 }
    spec:
      serviceAccountName: metering
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: metering
          image: PYTHON_BASE_IMAGE_PLACEHOLDER
          command: ["python3", "-u", "/app/metering.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: GPU_RESOURCE, value: "nvidia.com/gpu" }
            - { name: VCPU_RESOURCE, value: "cpu" }
            - { name: MEM_RESOURCE, value: "memory" }
            - { name: POLL_SECONDS, value: "15" }
            - { name: LEDGER_PATH, value: "/ledger/allocations.jsonl" }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: ledger, mountPath: /ledger }
            - { name: tenants, mountPath: /etc/arise, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
      volumes:
        - name: code
          configMap: { name: metering-code }
        - name: ledger
          persistentVolumeClaim: { claimName: metering-ledger }
        - name: tenants
          configMap: { name: platform-tenants, optional: true }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: metering
  namespace: platform-system
  labels: { app.kubernetes.io/name: metering }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: metering }
  ports: [{ name: http, port: 8080, targetPort: http }]
