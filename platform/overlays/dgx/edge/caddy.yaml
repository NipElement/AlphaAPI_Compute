# Caddy owns ACME renewal and serves this one platform hostname. No Kubernetes
# API access or cluster-wide RBAC is needed. The head's firewall exposes only
# 80/443; 8081 is a loopback-only health listener. Data survives edge-off.
apiVersion: v1
kind: Namespace
metadata:
  name: edge-system
  labels:
    # privileged ONLY for hostNetwork :80/:443 + NET_BIND_SERVICE;
    # arise-privileged-namespace-envelope (platform/base) admits nothing else
    # here and only pods created through the Deployment.
    pod-security.kubernetes.io/enforce: privileged # hostNetwork, low ports
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ConfigMap
metadata: { name: platform-edge-settings, namespace: edge-system }
data:
  CONSOLE_FQDN: REPLACE_WITH_CONSOLE_FQDN
  ACME_EMAIL: REPLACE_WITH_OPS_EMAIL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: platform-edge-data, namespace: edge-system }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: arise-longterm
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: platform-edge, namespace: edge-system }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: platform-edge } }
  template:
    metadata: { labels: { app.kubernetes.io/name: platform-edge } }
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      containers:
        - name: edge
          # versions.env CADDY_IMAGE; official 2.11.4-alpine, resolved 2026-09-05
          image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          args: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          envFrom:
            - configMapRef: { name: platform-edge-settings }
          ports:
            - { name: http, containerPort: 80 }
            - { name: https, containerPort: 443 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            exec: { command: [wget, -q, -T, "2", -O, /dev/null, http://127.0.0.1:8081/healthz] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [wget, -q, -T, "2", -O, /dev/null, http://127.0.0.1:8081/healthz] }
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - { name: config, mountPath: /etc/caddy, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: runtime, mountPath: /config }
      volumes:
        - name: config
          configMap: { name: platform-edge-config }
        - name: data
          persistentVolumeClaim: { claimName: platform-edge-data }
        - name: runtime
          emptyDir: { sizeLimit: 10Mi }
