# cert-manager is installed by Helm at the pinned chart version (values in
# infra/dgx/operators/cert-manager-values.yaml); these are the objects that
# depend on it. Nothing here applies cleanly until it is installed — which is
# the point: the edge is a deliberate Day-0 step 12, not a side effect.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: letsencrypt }
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_WITH_OPS_EMAIL          # ⟪DECIDE-D4⟫ expiry notices go here
    privateKeySecretRef: { name: letsencrypt-account }
    solvers:
      - http01:
          ingress: { ingressClassName: nginx }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-gateway
  namespace: platform-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    # The gateway's admin plane (/oapi /prom /am /auth/users) rides the same
    # host today; splitting it onto an ops-only hostname is the register's
    # open "admin plane" decision. Until then the gateway's role check is the
    # control, and this rate limit is the edge's contribution against
    # credential stuffing on /auth/login (the gateway throttles too).
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "50"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [REPLACE_WITH_CONSOLE_FQDN]   # ⟪DECIDE-D4⟫ e.g. console.arise.ai
      secretName: platform-gateway-tls
  rules:
    - host: REPLACE_WITH_CONSOLE_FQDN      # ⟪DECIDE-D4⟫
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: platform-gateway, port: { number: 8080 } }
