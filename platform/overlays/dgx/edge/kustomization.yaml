apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Explicit cutover only: make dgx-edge. Never exposed by make dgx-deploy.
resources:
  - caddy.yaml
configMapGenerator:
  - name: platform-edge-config
    namespace: edge-system
    files: [Caddyfile]
labels:
  - includeSelectors: false
    pairs: { project: arise-b300, arise.ai/overlay: dgx-edge }
