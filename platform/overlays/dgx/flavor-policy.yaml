# ============================================================================
# Resource-flavor quantization — the anti-fragmentation gate (FLV-01).
# DGX overlay: PORTED from overlays/lab/flavor-policy.yaml.
#
# The CEL below is byte-identical to the lab's — it validates only cpu and
# memory, which are hardware-independent. The grid, restated for hardware:
#
#   cpu             >= 500m  and a multiple of 500m   (half-core steps;
#                    a B300 node has 256 threads — 512 grid points)
#   memory          >= 512Mi and a multiple of 512Mi  (2 TiB/node)
#   nvidia.com/gpu  integer 0..8 — enforced natively by Kubernetes for
#                    extended resources; no CEL needed, on either overlay
#   PVC storage     >= 10Gi  and a multiple of 10Gi   (policy below)
#
# Float-arithmetic note: every legal grid point (k*500m, k*512Mi, k*10Gi) is
# exactly representable in float64, so the boundary is exact.
#
# Scope: tenant namespaces only (arise.ai/tier=tenant). Platform components
# keep their small requests — quantizing a 25m metrics sidecar up to 500m
# would waste exactly the resources this policy exists to protect.
# ============================================================================
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arise-flavor-quantization
  labels:
    project: arise-b300
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    # No GPUs in initContainers (2026-08-27). Kubernetes' effective request
    # is max(initContainers) vs sum(containers): an init container that asks
    # for 8 GPUs holds 8 GPUs while it runs, invisibly to anyone counting
    # main containers. Metering now counts them correctly; this rule removes
    # the ambiguity entirely — a tenant's GPU work runs in main containers.
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c,
          !has(c.resources) || (
            (!has(c.resources.requests) || !('nvidia.com/gpu' in c.resources.requests)) &&
            (!has(c.resources.limits)   || !('nvidia.com/gpu' in c.resources.limits))))
      message: >-
        GPUs may not be requested by initContainers. Put GPU work in a main
        container so it is scheduled, isolated and metered as one interval.
      reason: Forbidden
    # terminationGracePeriodSeconds is capped because it is the OTHER half of
    # the node-handover deadline. Eviction is polite: the kubelet sends
    # SIGTERM and waits out the pod's grace period. A pod may therefore keep
    # a node in DRAINING for exactly as long as its grace period, and the
    # controller quarantines the node when the drain outstays
    # DRAIN_TIMEOUT_SECONDS (600s). Uncapped, a customer could set 86400 and
    # park a B300 out of the sellable fleet for a day — or, just as bad, make
    # every ordinary handover of their node end in a quarantine. 300s is
    # generous for checkpoint-on-SIGTERM; the two numbers are kept apart by
    # dgx-render-check.sh, which fails if the deadline is not >= 2x this cap.
    - expression: >-
        !has(object.spec.terminationGracePeriodSeconds) ||
        object.spec.terminationGracePeriodSeconds <= 300
      message: >-
        terminationGracePeriodSeconds may not exceed 300 (5 minutes). A node
        handover evicts your pods and waits out their grace period; a longer
        one holds a whole machine out of service. Checkpoint within 5 minutes,
        or write checkpoints continuously.
      reason: Forbidden
    - expression: >-
        variables.allContainers.all(c,
          !has(c.resources) || !has(c.resources.requests) ||
          !('cpu' in c.resources.requests) ||
          (
            int(quantity(c.resources.requests['cpu']).asApproximateFloat() * 1000.0) >= 500 &&
            int(quantity(c.resources.requests['cpu']).asApproximateFloat() * 1000.0) % 500 == 0
          ))
      message: >-
        CPU requests must be at least 500m and a multiple of 500m (half-core
        units). Arbitrary sizes fragment nodes until nothing whole is left to
        rent; pick the nearest half-core step up.
      reason: Forbidden
    - expression: >-
        variables.allContainers.all(c,
          !has(c.resources) || !has(c.resources.requests) ||
          !('memory' in c.resources.requests) ||
          (
            int(quantity(c.resources.requests['memory']).asApproximateFloat()) >= 536870912 &&
            int(quantity(c.resources.requests['memory']).asApproximateFloat()) % 536870912 == 0
          ))
      message: >-
        Memory requests must be at least 512Mi and a multiple of 512Mi.
        Pick the nearest 512Mi step up.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arise-flavor-quantization
spec:
  policyName: arise-flavor-quantization
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        arise.ai/tier: tenant
---
# ---------------------------------------------------------------------------
# Storage requests: same idea, coarser grid. Also pins tenants to the two
# product storage classes — a PVC with no class or a random class would fall
# through to whatever default the cluster happens to have.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arise-storage-quantization
  labels:
    project: arise-b300
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["persistentvolumeclaims"]
  variables:
    - name: req
      expression: "object.spec.resources.requests['storage']"
    - name: sc
      expression: >-
        has(object.spec.storageClassName) ? object.spec.storageClassName : ''
  validations:
    - expression: >-
        int(quantity(variables.req).asApproximateFloat()) >= 10737418240 &&
        int(quantity(variables.req).asApproximateFloat()) % 10737418240 == 0
      messageExpression: >-
        'storage requests must be at least 10Gi and a multiple of 10Gi; got ' +
        string(variables.req)
      reason: Forbidden
    - expression: "variables.sc in ['arise-shared', 'arise-longterm']"
      messageExpression: >-
        'storageClassName must be arise-shared (working data, deleted with the
        claim) or arise-longterm (retained); got "' + variables.sc + '"'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arise-storage-quantization
spec:
  policyName: arise-storage-quantization
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        arise.ai/tier: tenant
