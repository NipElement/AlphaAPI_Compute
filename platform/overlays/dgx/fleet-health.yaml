# ============================================================================
# Fleet health — node-exporter + kube-state-metrics (DGX overlay only).
#
# WHY DGX-ONLY: the lab's compensating control for host disk is guard.sh
# (WAIVER W-3, reads `df` on every mutating make target), and the lab's
# monitoring.yaml deliberately carries NO rule against node-exporter series —
# an alert referencing a series that does not exist can never fire, and looks
# like coverage while providing none (the HostDiskLow lesson, 2026-08-17).
# Here the series WILL exist, so the rules live in this overlay's
# monitoring.yaml and nowhere else.
#
# PLACEMENT-DOCTRINE EXCEPTION, stated rather than snuck in: platform pods
# stay off sellable GPU nodes — EXCEPT observability DaemonSets, which exist
# precisely to watch every node (a disk filling on a VAST-rented machine is
# still our disk). node-exporter therefore tolerates every arise.ai/* owner
# taint plus the control-plane taint, runs in platform-system (PSA privileged;
# it needs hostPath / hostNetwork, which the monitoring namespace's baseline
# PSA rightly refuses), and requests almost nothing.
# ============================================================================

# ------------------------------------------------------- node-exporter ------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: platform-system
  labels: { app.kubernetes.io/name: node-exporter, project: arise-b300 }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: node-exporter }
  template:
    metadata:
      labels: { app.kubernetes.io/name: node-exporter, project: arise-b300 }
    spec:
      automountServiceAccountToken: false
      hostNetwork: true            # :9100 on every node IP; prometheus
      hostPID: true                #  scrapes by node address
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
        - { key: arise.ai/vast-owned,    operator: Exists, effect: NoSchedule }
        - { key: arise.ai/direct-owned,  operator: Exists, effect: NoSchedule }
        - { key: arise.ai/transition,    operator: Exists, effect: NoSchedule }
        - { key: arise.ai/maintenance,   operator: Exists, effect: NoSchedule }
        - { key: arise.ai/storage-only,  operator: Exists, effect: NoSchedule }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
          args:
            - --path.rootfs=/host/root
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --web.listen-address=:9100
            # Only the collectors the alert rules read; every extra collector
            # is surface without a consumer.
            - --collector.disable-defaults
            - --collector.filesystem
            - --collector.cpu
            - --collector.meminfo
            - --collector.loadavg
            - --collector.diskstats
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/kubelet/pods)($|/)
          ports: [{ name: metrics, containerPort: 9100 }]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: proc, mountPath: /host/proc, readOnly: true }
            - { name: sys,  mountPath: /host/sys,  readOnly: true }
            - { name: root, mountPath: /host/root, readOnly: true, mountPropagation: HostToContainer }
      volumes:
        - { name: proc, hostPath: { path: /proc } }
        - { name: sys,  hostPath: { path: /sys } }
        - { name: root, hostPath: { path: / } }
---
# --------------------------------------------------- kube-state-metrics -----
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: { app.kubernetes.io/name: kube-state-metrics, project: arise-b300 }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arise:kube-state-metrics
rules:
  # Read-only over exactly what the alert rules consume (nodes, pods) plus the
  # workload owners needed to label them. An observer that can mutate is not
  # an observer — same doctrine as prometheus.
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes", "persistentvolumeclaims", "resourcequotas"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arise:kube-state-metrics
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "arise:kube-state-metrics" }
subjects:
  - { kind: ServiceAccount, name: kube-state-metrics, namespace: monitoring }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: { app.kubernetes.io/name: kube-state-metrics, project: arise-b300 }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kube-state-metrics } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kube-state-metrics, project: arise-b300 }
    spec:
      serviceAccountName: kube-state-metrics
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics@sha256:37d841299325c23b56e5951176ce8ef317d537447c0f1b2d2437dddbb1f51165
          args:
            - --resources=nodes,pods,deployments,daemonsets,statefulsets,replicasets,jobs,cronjobs,persistentvolumes,persistentvolumeclaims,resourcequotas
          ports: [{ name: metrics, containerPort: 8080 }]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 5
      # No token automount override: this one legitimately talks to the API.
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: { app.kubernetes.io/name: kube-state-metrics }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: kube-state-metrics }
  ports: [{ name: metrics, port: 8080, targetPort: metrics }]
