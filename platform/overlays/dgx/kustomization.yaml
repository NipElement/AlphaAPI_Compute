apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ============================================================================
# DGX overlay — for delivered B300 hardware. NOT for the CPU prelab.
#
# WHAT IS INHERITED FROM base/ (validated in Phase A, reusable per plan §13.1):
#   namespaces + PSA levels, ResourceQuota / LimitRange, RBAC, NetworkPolicy,
#   and the NodeOwnership CRD with its CEL invariants.
#
# WHAT THIS OVERLAY NOW CARRIES (WS1, ported from the rehearsed lab manifests
# with every kind-ism removed — each file's header states its diffs):
#   - gateway.yaml        SPA via registry content image + initContainer, no
#                         hostPath / docker cp
#   - deployments.yaml    capacity-controller with VAST_ADAPTER=none (honest
#                         no-marketplace mode; ARISE<->DIRECT fully live,
#                         desired=VAST fails fast — tests/unit_adapter_modes.py)
#   - tenant-portal.yaml  rehearsed RBAC verbatim; counts nvidia.com/gpu
#   - ui.yaml             ops-console, single-writer RBAC verbatim
#   - monitoring.yaml     ownership/contract/controller alerts; DCGM scrape
#                         stub ready for the GPU Operator
#   - queue-binding-policy.yaml / flavor-policy.yaml   rehearsed gates verbatim
#   - storage.yaml        REAL dynamic provisioning on node NVMe (/raid);
#                         cross-node shared FS remains decision D2
#
# WHAT IS DELIBERATELY ABSENT — and must stay absent:
#   - fake-gpu-advertiser + fake-gpu-plugin: no simulated capacity on real
#     hardware, ever. admission-policies.yaml denies arise.dev/fake-gpu as the
#     second, independent mechanism.
#   - vast-mock: a fake marketplace must not exist beside real contracts. The
#     controller's none-adapter states the no-marketplace truth instead.
#   - grafana.yaml: the lab instance runs anonymous-viewer with no login (safe
#     only behind port-forward); on hardware that is HW-14 — real auth first.
#
# WHAT REMAINS FOR DAY-0 ON THE MACHINE (hardware facts nobody has yet —
# docs/production-readiness.md §3 runbook, runbooks/gaps.md §4):
#   - NVIDIA GPU Operator v26.3.3 + Network Operator v26.4.0: install decided
#     WITH the vendor after checking what DGX OS already ships (never let the
#     OS and the Operator both manage the driver). Then uncomment the
#     dcgm-exporter scrape in monitoring.yaml and add DCGM alert rules.
#   - Volcano + queues + scheduler config: a make/runbook step, not kustomize
#     resources — the queues depend on CRDs the installer creates.
#   - Registry retag: the images block below pins WHAT runs; Day-0 prefixes
#     WHERE it is pulled from (the chosen registry) and swaps tags for pushed
#     digests. One kustomize edit, recorded in the change window.
#   - The real VAST adapter (VST-06): its own approval AND code change.
#
# Promotion is a change of overlay, never an edit of shared manifests. If you
# find yourself editing platform/base to make the DGX cluster work, stop: that
# would silently change the lab too, and the lab is the only thing that has
# been tested.
# ============================================================================

resources:
  - ../../base
  - ../../../controller        # NodeOwnership CRD — identical to the lab
  - admission-policies.yaml
  - deployments.yaml
  - monitoring.yaml
  - ui.yaml
  - queue-binding-policy.yaml
  - flavor-policy.yaml
  - storage.yaml
  - tenant-portal.yaml
  - gateway.yaml
  - etcd-backup.yaml
  - fleet-health.yaml

# Code ConfigMaps (capacity-controller-code, ops-console-code,
# tenant-portal-code, platform-gateway-code) are applied by `make dgx-code`
# (Makefile — a DGX_KCTX-parameterized variant of the lab's `code` target with
# no lab components and no docker-cp) rather than generated here, for the same
# reason as the lab: kustomize's load restrictor forbids reading services/
# sources from outside the overlay dir, and keeping each service's source
# under services/ is worth more than satisfying the generator.

images:
  # Digest-pinned as the lab is. NO retag needed at Day-0: node-bootstrap.sh 4b
  # makes containerd resolve docker.io/… transparently through the mirror
  # (REGISTRY_MIRROR), where registry-mirror.sh stored it under
  # docker.io/library/python at the SAME digest (content-addressed).
  - name: PYTHON_BASE_IMAGE_PLACEHOLDER
    newName: python
    digest: sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
  # arise/web has no registry home until Day-0 pushes it, so it deliberately
  # resolves to a name that CANNOT pull: .invalid is an IETF-reserved TLD, so
  # an out-of-order apply fails loudly (ImagePullBackOff) instead of silently
  # pulling docker.io/arise/web — a public Docker Hub name nobody here
  # controls, i.e. a supply-chain hole. Day-0 replaces newName with the real
  # registry path and pins the PUSHED digest (`make web-image` prints the
  # image id; the push emits the registry digest). dgx-render-check.sh
  # enforces exactly this: every image digest-pinned OR this sentinel.
  - name: ARISE_WEB_IMAGE_PLACEHOLDER
    newName: day0-registry.invalid/arise/web
    newTag: dgx
  # rancher/local-path-provisioner and busybox (helper + web base) are pinned
  # by digest directly in their manifests.

labels:
  - includeSelectors: false
    pairs:
      arise.ai/overlay: dgx
      # Override the base-inherited project label so the whole render is
      # uniformly arise-b300 — `kubectl get -l project=arise-b300` on hardware
      # must return every object, not just the overlay-authored ones. No
      # selector keys on `project` (bindings key on arise.ai/tier), so this is
      # identity-only and safe.
      project: arise-b300

# ---------------------------------------------------------------------------
# Base specialization — the kustomize-native way to promote WITHOUT editing
# the meaning of shared manifests (the house rule above).
#
# Lab-only base residents (vast-mock namespace family, fake-gpu-plugin RBAC)
# are NOT deleted here: they were moved out of base into
# overlays/lab/lab-simulation-identity.yaml on 2026-08-26 with an object-set
# diff proving the lab render unchanged. (kustomize's `$patch: delete` cannot
# remove whole resources — verified against v5.8.1 — so exclusion by file
# placement is the mechanism, as it should be.)
#
# What remains are REWRITES of the tenant quotas and limits from lab-host
# magnitudes to hardware magnitudes:
#
#   - GPU: a ResourceQuota on arise.dev/fake-gpu limits NOTHING here —
#     tenants would hold UNLIMITED claim on real, billable nvidia.com/gpu.
#     Same rehearsed numbers (24/16 of a 4-node fleet's 32, intentionally
#     oversubscribed per SCH-03), real resource; sim-* keys removed.
#   - CPU/memory: base sizes fit the c4.2xlarge prelab (12 CPU / 20Gi). A
#     single legitimate training pod on a B300 node wants more than that
#     entire quota. The rehearsed REAL-magnitude numbers already exist as the
#     sim-vcpu/sim-mem-gi values (768/512 vCPU, 6144/4096 Gi = 3/2 nodes'
#     worth) — they become the real cpu/memory quotas.
#   - storage: 200Gi was lab-sized; the product sells ~30 TB NVMe per node.
#     Same shared>longterm oversubscription shape, hardware scale.
#   - LimitRange max: 8 CPU / 16Gi would cap every container below one GPU's
#     CPU share (256 threads / 8 GPUs). Max becomes a whole node; defaults
#     stay on the quantization grid (500m / 512Mi — flavor-policy).
#
# All of these are day-0 DEFAULTS, tuned per contract at onboarding — but
# they must start at magnitudes that cannot silently break a real customer's
# first workload.
patches:
  # ---- tenant egress: FAIL-CLOSED on hardware -----------------------------
  # The base policy enumerates the LAB's host network (172.31.0.0/16, the AWS
  # VPC) — meaningless on the DGX floor, whose management/BMC/storage/IB
  # ranges are decision D1/D4 and not known today. Enumerating a guessed
  # range would be fail-OPEN (a wrong guess lets tenants at the BMCs). So on
  # dgx tenants may reach the PUBLIC internet only: every RFC1918 range plus
  # link-local, pod and service CIDRs are denied. A customer needing a private
  # endpoint uses a public address or a VPN of their own — an honest day-0
  # posture that needs no decision. Narrow it deliberately later, if ever.
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: deny-imds-and-host-links
        namespace: tenant-arise
      spec:
        egress:
          - to:
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                    - 169.254.0.0/16    # link-local / IMDS-class endpoints
                    - 10.0.0.0/8        # every private range: the datacenter
                    - 172.16.0.0/12     #   management, BMC, storage and IB
                    - 192.168.0.0/16    #   networks live somewhere in here
                    - 10.96.0.0/12      # service CIDR (versions.env)
                    - 10.244.0.0/16     # pod CIDR (versions.env)
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: deny-imds-and-host-links
        namespace: tenant-direct
      spec:
        egress:
          - to:
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                    - 169.254.0.0/16    # link-local / IMDS-class endpoints
                    - 10.0.0.0/8        # every private range: the datacenter
                    - 172.16.0.0/12     #   management, BMC, storage and IB
                    - 192.168.0.0/16    #   networks live somewhere in here
                    - 10.96.0.0/12      # service CIDR (versions.env)
                    - 10.244.0.0/16     # pod CIDR (versions.env)
  - patch: |-
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: tenant-arise-quota
        namespace: tenant-arise
      spec:
        hard:
          requests.arise.dev/fake-gpu: null
          requests.arise.dev/sim-vcpu: null
          requests.arise.dev/sim-mem-gi: null
          requests.nvidia.com/gpu: "24"
          requests.cpu: "768"
          requests.memory: 6144Gi
          limits.cpu: "1536"
          limits.memory: 12288Gi
          requests.storage: 30Ti
          arise-shared.storageclass.storage.k8s.io/requests.storage: 24Ti
          arise-longterm.storageclass.storage.k8s.io/requests.storage: 12Ti
  - patch: |-
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: tenant-direct-quota
        namespace: tenant-direct
      spec:
        hard:
          requests.arise.dev/fake-gpu: null
          requests.arise.dev/sim-vcpu: null
          requests.arise.dev/sim-mem-gi: null
          requests.nvidia.com/gpu: "16"
          requests.cpu: "512"
          requests.memory: 4096Gi
          limits.cpu: "1024"
          limits.memory: 8192Gi
          requests.storage: 30Ti
          arise-shared.storageclass.storage.k8s.io/requests.storage: 24Ti
          arise-longterm.storageclass.storage.k8s.io/requests.storage: 12Ti
  - patch: |-
      apiVersion: v1
      kind: LimitRange
      metadata:
        name: tenant-arise-limits
        namespace: tenant-arise
      spec:
        limits:
          - type: Container
            default:
              cpu: "1"
              memory: 1Gi
            defaultRequest:
              cpu: 500m
              memory: 512Mi
            max:
              cpu: "256"
              memory: 2048Gi
            min:
              cpu: 10m
              memory: 16Mi
  - patch: |-
      apiVersion: v1
      kind: LimitRange
      metadata:
        name: tenant-direct-limits
        namespace: tenant-direct
      spec:
        limits:
          - type: Container
            default:
              cpu: "1"
              memory: 1Gi
            defaultRequest:
              cpu: 500m
              memory: 512Mi
            max:
              cpu: "256"
              memory: 2048Gi
            min:
              cpu: 10m
              memory: 16Mi
