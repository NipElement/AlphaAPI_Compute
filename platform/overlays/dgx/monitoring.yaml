# ============================================================================
# Monitoring — DGX overlay. PORTED FROM overlays/lab/monitoring.yaml.
#
# Same doctrine: the OBSERVER, never the source of truth. Prometheus holds
# only read verbs; no alert has automated remediation attached.
#
# Differences from the lab, all deliberate:
#   - fake-gpu-advertiser scrape job REMOVED (the component does not exist
#     here) and the FakeGPUHealthLoss rule with it — on hardware, GPU health
#     is DCGM's job, wired in when the GPU Operator lands (Day-0 runbook).
#     A commented dcgm-exporter scrape stub marks the spot.
#   - external cluster label arise-b300-dgx, so if lab and dgx metrics ever
#     meet in one datastore they cannot be confused.
#   - both deployments pinned to the control-plane/head node: infra stays off
#     sellable GPU nodes.
#   - Alertmanager config comes from the make-owned Secret alertmanager-config
#     (seeded local-sink by `make dgx-code`; the real receiver is one command:
#     `make dgx-alert-receiver WEBHOOK_URL=...`). It is a Secret so an overlay
#     re-apply can never silently revert the pager to a null sink.
#   - Prometheus (15d retention) and Alertmanager (silences/notification log)
#     persist on PVCs so a pod restart does not erase the evidence an incident
#     review needs. Binding depends on head-node storage (D1) like the
#     metering ledger; verify-dgx DGX-09 catches a Pending Prometheus.
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels: { project: arise-b300 }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arise:prometheus
rules:
  # Read-only everywhere. An observer that can mutate is not an observer.
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arise:prometheus
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: arise:prometheus }
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: monitoring }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels: { project: arise-b300 }
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: arise-b300-dgx
    rule_files:
      - /etc/prometheus/rules/*.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.monitoring.svc:9093']
    scrape_configs:
      - job_name: capacity-controller
        static_configs:
          - targets: ['capacity-controller.platform-system.svc:8080']
      # The allocation ledger's per-tenant series: a CROSS-CHECK on the ledger
      # (chain_ok, open intervals, gpu-seconds), never the billing source.
      - job_name: metering
        static_configs:
          - targets: ['metering.platform-system.svc:8080']
      - job_name: kubernetes-nodes
        scrape_interval: 30s
        kubernetes_sd_configs: [{ role: node }]
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
      # node-exporter runs hostNetwork:9100 on EVERY node (fleet-health.yaml),
      # so discovery by node address needs no per-pod plumbing.
      - job_name: node-exporter
        scrape_interval: 30s
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.*):\d+'
            replacement: '$1:9100'
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
      - job_name: kube-state-metrics
        scrape_interval: 30s
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc:8080']
      # Uncomment when the GPU Operator (and its dcgm-exporter) is installed
      # at Day-0 — the service name below is the operator's default. GPU
      # health/Xid alerting (the hardware half of FakeGPUHealthLoss) rides on
      # this job.
      # - job_name: dcgm-exporter
      #   scrape_interval: 30s
      #   static_configs:
      #     - targets: ['nvidia-dcgm-exporter.gpu-operator.svc:9400']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
  labels: { project: arise-b300 }
data:
  arise.yml: |
    groups:
      - name: arise-ownership
        rules:
          # P0 — the single-owner invariant. Two owner series at 1 means
          # Kubernetes and the marketplace could both schedule the same GPU;
          # zero means the controller lost a node. Both are P0.
          - alert: OwnerConflict
            expr: sum by (node) (arise_node_owner) != 1
            for: 1m
            labels: { severity: P0 }
            annotations:
              summary: "node {{ $labels.node }} does not have exactly one owner"
              description: >-
                sum(arise_node_owner)={{ $value }} for 1m. Quarantine the node;
                stop all scheduling and listing for it.

          # P0 — contract protection. ARISE-owned while contracts are live
          # would mean a paying rental was reclaimed underneath the customer.
          - alert: ContractReclaimAttempt
            expr: (arise_active_contracts > 0) and on(node) (arise_node_owner{owner="ARISE"} == 1)
            for: 30s
            labels: { severity: P0 }
            annotations:
              summary: "{{ $labels.node }} is ARISE-owned while contracts are active"
              description: >-
                An active rental must run to its end; unlist is not reclaim.
                Freeze the controller and confirm with the approver.

      - name: arise-transitions
        rules:
          - alert: ControllerDown
            expr: up{job="capacity-controller"} == 0
            for: 2m
            labels: { severity: P1 }
            annotations:
              summary: "capacity-controller is not scrapeable"
              description: >-
                Ownership is unobservable while this is down. Do NOT make
                manual owner changes to compensate.

          - alert: ControllerReconcileErrors
            expr: sum(rate(arise_reconcile_errors_total[5m])) > 0
            for: 5m
            labels: { severity: P1 }
            annotations:
              summary: "capacity-controller reconcile errors for 5m"

      # GPU health from dcgm-exporter (GPU Operator, Day-0 step 10). The
      # exporter's DEFAULT counter set does not emit ECC_DBE / RETIRED_PENDING
      # / ROW_REMAP_PENDING / CLOCK_THROTTLE_REASONS / NVLINK_*: the operator
      # values point dcgmExporter.config at infra/dgx/operators/dcgm-metrics.csv
      # (ConfigMap arise-dcgm-metrics in gpu-operator) which enables them —
      # verify at Day-0 step 10 with `curl :9400/metrics | grep DCGM_FI_DEV_ECC_DBE`.
      # These rules evaluate to nothing until the dcgm-exporter scrape job above is
      # uncommented — they are pre-written so the pager knows about Xid / ECC /
      # thermal / NVLink faults the moment the exporter exists, and they are
      # what runbooks/incident-gpu-fault.md is written against. Labels: DCGM
      # exports Hostname + gpu (index) + UUID on every series.
      # ---- the money path -------------------------------------------------
      # Empirically established 2026-08-30: metering exposed eight metrics and
      # NOT ONE alert watched them. A meter that dies, cannot write, or has a
      # broken chain is free GPUs and an unprovable invoice — the two most
      # expensive silent failures this platform has.
      - name: arise-billing
        rules:
          - alert: MeteringDown
            # No meter = no record = the fleet runs for free and nobody knows.
            expr: up{job="metering"} == 0 or absent(up{job="metering"})
            for: 5m
            labels: { severity: critical, runbook: incident-metering }
            annotations:
              summary: "the allocation meter is not being scraped"
              description: "Usage accrued while the meter was down is NOT in the ledger. Check the metering pod and its PVC, then reconcile the gap by hand from pod start times before invoicing."
          - alert: LedgerChainBroken
            expr: arise_metering_ledger_chain_ok == 0
            for: 0m
            labels: { severity: critical, runbook: incident-metering }
            annotations:
              summary: "allocation ledger hash chain is BROKEN"
              description: "A record no longer hashes to its predecessor: corruption or tampering. Do not invoice from this ledger until a human resolves it (invoice.py refuses with exit 3). Compare the head against the last anchored value."
          - alert: LedgerShrank
            # The head metric's own contract: a seq that goes DOWN is a
            # truncated ledger. Append-only means records only ever increase.
            expr: arise_metering_ledger_records < max_over_time(arise_metering_ledger_records[24h])
            for: 5m
            labels: { severity: critical, runbook: incident-metering }
            annotations:
              summary: "the append-only ledger got SHORTER ({{ $value }} records)"
              description: "Records were deleted or the PVC was replaced. The ledger is the only record of what customers owe: stop, snapshot the PVC, and recover before anything else writes to it."
          - alert: MeteringPollErrors
            expr: increase(arise_metering_poll_errors_total[15m]) > 3
            for: 0m
            labels: { severity: warning, runbook: incident-metering }
            annotations:
              summary: "the meter is failing to poll or to write"
              description: "A full or read-only ledger PVC drops intervals for pods that start AND end while it lasts (verified 2026-08-30). Free space or fix API access now."
          - alert: MeteringSeesNothing
            # Cross-check against a source the meter does not control: tenant
            # pods are running but the meter holds no open interval.
            expr: sum(kube_pod_status_phase{phase="Running",namespace=~"tenant-.*"}) > 0 and max(arise_metering_open_intervals) == 0
            for: 15m
            labels: { severity: critical, runbook: incident-metering }
            annotations:
              summary: "tenant pods are running but the meter has no open intervals"
              description: "The meter is alive but blind (wrong tenant list, RBAC, or resource name). Every minute here is unbilled."
          - alert: LedgerVolumeFilling
            expr: kubelet_volume_stats_available_bytes{persistentvolumeclaim="metering-ledger"} / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim="metering-ledger"} < 0.15
            for: 10m
            labels: { severity: warning, runbook: incident-metering }
            annotations:
              summary: "ledger PVC under 15% free"
              description: "A full ledger PVC silently drops short-lived pods' intervals. Grow the PVC or archive closed months (the ledger is append-only: archive by copying, never by truncating in place)."
      - name: arise-storage-path
        rules:
          - alert: RaidMountMissing
            # Every fleet node (GPU and head) must have /raid mounted: the
            # .raid-verified sentinel stops NEW provisioning on an unmounted
            # path, but an EXISTING PV's hostPath (DirectoryOrCreate) would
            # silently mount an empty OS-disk directory (audit 2026-08-27).
            expr: up{job="node-exporter"} == 1 unless on(instance) node_filesystem_size_bytes{mountpoint="/raid"}
            for: 5m
            labels: { severity: critical, runbook: incident-disk-full }
            annotations:
              summary: "{{ $labels.instance }} has no /raid mountpoint"
              description: "RAID not assembled or not mounted. Cordon the node (MAINTENANCE) before any tenant volume lands on the OS disk; check mdadm/DGX OS."
      - name: arise-gpu-health
        rules:
          - alert: GpuXidError
            # DCGM_FI_DEV_XID_ERRORS is the CODE of the last Xid (a gauge),
            # not a counter: fire when it changed in the window, report the
            # code. A repeat of the SAME code is invisible here — that needs
            # DCGM's Xid event stream (runbook step 1: nvidia-smi -q).
            expr: max_over_time(DCGM_FI_DEV_XID_ERRORS[10m]) > 0 and changes(DCGM_FI_DEV_XID_ERRORS[10m]) > 0
            for: 0m
            labels: { severity: critical, runbook: incident-gpu-fault }
            annotations:
              summary: "Xid error on {{ $labels.Hostname }} GPU {{ $labels.gpu }}"
              description: "DCGM reports Xid code {{ $value }} (UUID {{ $labels.UUID }}). Map the GPU to the tenant pod, then follow the Xid table in the runbook."
          - alert: GpuUncorrectableEcc
            expr: increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL[1h]) > 0
            for: 0m
            labels: { severity: critical, runbook: incident-gpu-fault }
            annotations:
              summary: "uncorrectable ECC on {{ $labels.Hostname }} GPU {{ $labels.gpu }}"
              description: "Double-bit ECC errors are a retire-the-card signal: MAINTENANCE the node, dcgmi diag -r 2, open the RMA line."
          - alert: GpuRetiredPagesPending
            expr: DCGM_FI_DEV_RETIRED_PENDING > 0 or DCGM_FI_DEV_ROW_REMAP_PENDING > 0
            for: 5m
            labels: { severity: warning, runbook: incident-gpu-fault }
            annotations:
              summary: "{{ $labels.Hostname }} GPU {{ $labels.gpu }} has memory pages pending retirement/remap"
              description: "Takes effect on the next GPU reset: schedule a MAINTENANCE window before it becomes an Xid."
          - alert: GpuThermalThrottle
            # throttle reasons bitmask: 0x08 HW slowdown, 0x20 SW thermal, 0x40 HW thermal
            expr: DCGM_FI_DEV_GPU_TEMP > 85 or (floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 8) % 2 >= 1) or (floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 32) % 2 >= 1) or (floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 64) % 2 >= 1)
            for: 10m
            labels: { severity: warning, runbook: incident-gpu-fault }
            annotations:
              summary: "{{ $labels.Hostname }} GPU {{ $labels.gpu }} hot/throttling for 10m"
              description: "temp {{ $value }}. Check airflow/fans and the rack inlet before the card derates a customer job."
          - alert: GpuNvlinkErrors
            expr: increase(DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_COUNT_TOTAL[30m]) > 0 or increase(DCGM_FI_DEV_NVLINK_REPLAY_ERROR_COUNT_TOTAL[30m]) > 100
            for: 0m
            labels: { severity: warning, runbook: incident-gpu-fault }
            annotations:
              summary: "NVLink errors on {{ $labels.Hostname }} GPU {{ $labels.gpu }}"
              description: "The offer promises NVLink in writing. Re-run make dgx-hw-accept 1node on this node after the next window; recurring errors = RMA."
          - alert: GpuCountDropped
            expr: kube_node_status_allocatable{resource="nvidia_com_gpu"} < 8 and on(node) kube_node_labels{label_arise_ai_role="gpu"}
            for: 5m
            labels: { severity: critical, runbook: incident-gpu-fault }
            annotations:
              summary: "{{ $labels.node }} advertises {{ $value }}/8 GPUs"
              description: "A card fell off the bus or the device plugin marked it unhealthy. Capacity sold on this node is now over-committed: MAINTENANCE it, then nvidia-smi -q."
      # ---- are the detectors themselves alive? -----------------------------
      # An alert whose INPUT metric does not exist evaluates to nothing and is
      # indistinguishable from "healthy" — the same class of lie as a config
      # that was never loaded. Checked 2026-08-30: all 22 rules parse and all
      # return zero series, which is correct only while their inputs exist.
      - name: arise-detector-health
        rules:
          - alert: GpuMetricsMissing
            # Expected to fire between bring-up and Day-0 step 10 (GPU
            # Operator + dcgm-exporter). Silence it until then; after that it
            # means every GPU-health rule below is silently inert. The field
            # name also has to match the exporter's CSV (DCGM 4 renamed the
            # throttle field) — this is what catches a rename.
            expr: absent(DCGM_FI_DEV_XID_ERRORS) or absent(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL) or absent(DCGM_FI_DEV_CLOCKS_EVENT_REASONS)
            for: 30m
            labels: { severity: warning, runbook: incident-gpu-fault }
            annotations:
              summary: "DCGM counters the GPU alerts depend on are absent"
              description: "GpuXid/Ecc/Throttle/NVLink rules cannot fire without them. Check the dcgm-exporter scrape job (still commented until step 10) and the arise-dcgm-metrics ConfigMap field names against the exporter's own default-counters.csv."
          - alert: KubeStateMetricsMissing
            expr: absent(kube_pod_status_phase) or absent(kube_node_status_allocatable)
            for: 15m
            labels: { severity: warning, runbook: incident-node-down }
            annotations:
              summary: "kube-state-metrics series are absent"
              description: "MeteringSeesNothing and GpuCountDropped are inert without them, and both are cross-checks on money and capacity."
          - alert: NodeExporterMissing
            expr: absent(node_filesystem_size_bytes)
            for: 15m
            labels: { severity: warning, runbook: incident-disk-full }
            annotations:
              summary: "node-exporter series are absent"
              description: "HostDiskLow*, RaidMountMissing and the disk half of the fleet view are inert without them."
      - name: arise-fleet-health
        rules:
          # These rules exist ONLY in the dgx overlay because only it deploys
          # node-exporter + kube-state-metrics (fleet-health.yaml). A rule
          # against an absent series can never fire and masquerades as
          # coverage — the HostDiskLow lesson (2026-08-17).
          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 3m
            labels: { severity: P0 }
            annotations:
              summary: "node {{ $labels.node }} is NotReady for 3m"
              description: >-
                On a 4-node sellable fleet one dead node is 25% of revenue
                capacity. Check power/BMC first, then kubelet; do NOT change
                ownership state to compensate — the controller holds position.

          # Absolute thresholds, not percentages (the house rule): on a 4 TB
          # OS disk "10% free" is 400 GB and panic-worthy at neither.
          - alert: HostDiskLowOS
            expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 100e9
            for: 10m
            labels: { severity: P1 }
            annotations:
              summary: "{{ $labels.instance }} OS disk under 100 GB free"
              description: >-
                Container images, etcd (head node) and logs live here. Prune
                images first (crictl rmi --prune), then check
                /var/lib/arise/etcd-backups retention.

          - alert: HostDiskLowRAID
            expr: node_filesystem_avail_bytes{mountpoint="/raid"} < 1e12
            for: 10m
            labels: { severity: P1 }
            annotations:
              summary: "{{ $labels.instance }} /raid under 1 TB free"
              description: >-
                Tenant volumes live on /raid, and local-path enforces no
                per-volume quota on disk — a tenant can write past its claim.
                Identify the largest volumes under /raid/arise/volumes and
                talk to the owning tenant before anything is deleted.

          - alert: PodCrashLooping
            expr: >-
              increase(kube_pod_container_status_restarts_total{
                namespace=~"platform-system|monitoring|storage-system"}[30m]) > 4
            for: 5m
            labels: { severity: P1 }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarting repeatedly"
              description: >-
                A crash-looping PLATFORM pod (tenant namespaces excluded —
                their crashes are their business, quota keeps them contained).
                kubectl logs --previous is the first stop.

      # GPU-health rules (Xid, thermal, ECC, nvlink) are DCGM territory and
      # land with the GPU Operator at Day-0 — see the dcgm-exporter scrape
      # stub in prometheus-config. Writing them against series that do not
      # exist yet would create alerts that can never fire (the HostDiskLow
      # lesson, 2026-08-17: an alert that cannot fire is worse than no alert).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app.kubernetes.io/name: prometheus, project: arise-b300 }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: prometheus } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus, project: arise-b300 }
    spec:
      serviceAccountName: prometheus
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.listen-address=0.0.0.0:9090
            - --web.enable-lifecycle
          ports: [{ name: http, containerPort: 9090 }]
          resources:
            requests: { cpu: 300m, memory: 768Mi }
            limits:   { cpu: "1",  memory: 1200Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: rules,  mountPath: /etc/prometheus/rules }
            - { name: data,   mountPath: /prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 15
            failureThreshold: 30
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: rules,  configMap: { name: prometheus-rules } }
        # A PVC, not emptyDir: an incident investigation needs the metrics
        # from BEFORE the pod restarted. Same D1 caveat as the metering ledger
        # — binds via local-path on the head node, which therefore needs the
        # .raid-verified sentinel once D1 gives the head node a data disk.
        - { name: data,   persistentVolumeClaim: { claimName: prometheus-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app.kubernetes.io/name: prometheus }
spec:
  type: ClusterIP        # never NodePort; reached through the gateway proxy
  selector: { app.kubernetes.io/name: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels: { app.kubernetes.io/name: alertmanager, project: arise-b300 }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: alertmanager } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alertmanager, project: arise-b300 }
    spec:
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: alertmanager
          image: prom/alertmanager@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=0.0.0.0:9093
          ports: [{ name: http, containerPort: 9093 }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 200m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data,   mountPath: /alertmanager }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 10
      volumes:
        # A SECRET, not an overlay ConfigMap, and make-owned (same pattern as
        # the code ConfigMaps): the receiver's webhook URL is a credential-
        # adjacent endpoint AND `make dgx-platform` re-applies would silently
        # revert an overlay ConfigMap to the local sink — un-paging the fleet
        # as a side effect of a deploy. `make dgx-code` seeds the local-sink
        # default; `make dgx-alert-receiver WEBHOOK_URL=...` wires the real
        # one and survives every subsequent overlay apply.
        - { name: config, secret: { secretName: alertmanager-config } }
        - { name: data,   persistentVolumeClaim: { claimName: alertmanager-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels: { app.kubernetes.io/name: alertmanager }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: alertmanager }
  ports: [{ name: http, port: 9093, targetPort: http }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
  labels: { app.kubernetes.io/name: prometheus, project: arise-b300 }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: arise-longterm
  resources:
    requests: { storage: 50Gi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: monitoring
  labels: { app.kubernetes.io/name: alertmanager, project: arise-b300 }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: arise-longterm
  resources:
    requests: { storage: 2Gi }
