# ============================================================================
# Queue↔namespace binding (SCH-12) — DGX overlay.
#
# PORTED VERBATIM from overlays/lab/queue-binding-policy.yaml (only the
# project label differs): this policy is pure control-plane and §13.1 lists it
# among the things that transfer unchanged. The rationale transfers too:
# Volcano does not natively restrict which queue a namespace may submit to,
# and one line of YAML (`spec.queue: direct-customer`) would otherwise convert
# internal work into work the scheduler refuses to reclaim — on this cluster
# that borrows a PAYING customer's entitlement.
#
# The mapping is an explicit allow-list, not a prefix convention: a naming
# convention is a comment that the API server does not read.
# ============================================================================
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arise-queue-binding
  labels:
    project: arise-b300
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["scheduling.volcano.sh"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["podgroups"]
      - apiGroups: ["batch.volcano.sh"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  variables:
    # INFRASTRUCTURE namespaces keep an explicit list: they are few, fixed, and
    # some legitimately need several queues (the test harness drives all three).
    - name: allowed
      expression: |
        {
          'test-system':     ['system', 'arise-internal', 'direct-customer'],
          'platform-system': ['system'],
          'monitoring':      ['system']
        }
    - name: ns
      expression: "request.namespace"
    - name: q
      expression: "has(object.spec.queue) ? object.spec.queue : 'default'"
    # TENANT entitlement comes from the namespace's own arise.ai/queue label
    # (2026-08-27). Tenants used to be enumerated here too, which meant
    # onboarding a customer required remembering to edit this CEL in BOTH
    # overlays — and forgetting silently downgraded that paying customer to the
    # 'default' queue: no weight, no reclaim protection, work the scheduler may
    # take back at any moment. A label is not a naming convention: the API
    # server reads it, and only an admin can set it (no tenant identity has any
    # verb on namespaces, SEC-06).
    - name: nsQueue
      expression: >-
        has(namespaceObject.metadata.labels) &&
        'arise.ai/queue' in namespaceObject.metadata.labels
          ? namespaceObject.metadata.labels['arise.ai/queue'] : ''
  validations:
    # Infra namespace -> its list. Labelled namespace -> exactly its own queue.
    # Anything else -> the default queue only, so a namespace with no declared
    # entitlement starts with none rather than inheriting someone else's.
    - expression: >-
        variables.ns in variables.allowed
          ? variables.q in variables.allowed[variables.ns]
          : (variables.nsQueue == ''
               ? variables.q == 'default'
               : variables.q == variables.nsQueue)
      messageExpression: >-
        'namespace ' + variables.ns + ' may not submit to queue ' + variables.q +
        '. Queues express contractual entitlement, not preference: borrowing a
        queue borrows its weight and its reclaim protection.'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arise-queue-binding
spec:
  policyName: arise-queue-binding
  validationActions: [Deny, Audit]
  matchResources: {}
---
# ---------------------------------------------------------------------------
# Contract-bound priority is not self-service either. A tenant that could set
# priorityClassName: arise-contract-bound would make its own work unpreemptable
# and outrank every real customer — the scheduler would faithfully honour it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arise-priority-binding
  labels:
    project: arise-b300
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: pc
      expression: "has(object.spec.priorityClassName) ? object.spec.priorityClassName : ''"
  validations:
    # Keyed on the tenant's OWNER CLASS (the arise.ai/owner namespace label the
    # register generates), not on one namespace name. arise-contract-bound
    # means "work fulfilling a paid contract", which is exactly what a
    # DIRECT-class tenant does — and the register is the authority for that
    # mapping (scripts/tenant-check.py asserts a DIRECT tenant's priorities are
    # exactly [arise-contract-bound], so the two cannot drift).
    #
    # It read `request.namespace == 'tenant-direct'` until 2026-09-01: the
    # SECOND whole-node customer could not use the priority class their
    # contract entitles them to, so their jobs were refused at pod admission
    # — the same hardcode that broke the owner gate, in the policy next door.
    # The name survives as a belt for a namespace that predates the label.
    - expression: >-
        variables.pc != 'arise-contract-bound' ||
        (has(namespaceObject.metadata.labels) &&
         'arise.ai/owner' in namespaceObject.metadata.labels &&
         namespaceObject.metadata.labels['arise.ai/owner'] == 'DIRECT') ||
        request.namespace == 'tenant-direct'
      message: >-
        priorityClassName arise-contract-bound is reserved for tenants whose
        namespace carries arise.ai/owner=DIRECT — work fulfilling a paid
        whole-node contract. Internal work must use arise-reserved or
        arise-best-effort. (The rule is the owner CLASS, not one namespace
        name: naming tenant-direct here refused every contract customer after
        the first — 2026-09-01.)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arise-priority-binding
spec:
  policyName: arise-priority-binding
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        arise.ai/tier: tenant
