# ============================================================================
# Storage — DGX overlay: the day-0 data path (FLV-03 hardware half).
#
# The lab validated the CONTROL surface (class taxonomy, quotas, quantized
# sizing, lifecycle) against kind's built-in provisioner. On hardware the same
# two product classes are backed by a REAL dynamic provisioner writing to the
# node-local NVMe RAID that DGX OS mounts at /raid (8x 3.84 TB E1.S per node).
#
# Provisioner choice — deliberate, and honestly labeled:
#   rancher/local-path-provisioner is a standalone upstream project (not a
#   kind-ism; kind merely bundles it) that provisions hostPath-style volumes
#   dynamically at any requested (quantized) size. It gives day-0 tenants real
#   NVMe-backed volumes with zero new architecture. What it does NOT give is a
#   CROSS-NODE shared filesystem: a volume lives on the node where the first
#   consumer pod lands, and follows that node thereafter. The vePFS-style
#   shared pool remains decision D2 (docs/production-readiness.md §0) — when
#   it lands, these classes re-point at it; the class NAMES are the API and
#   they do not change.
#
# Wiring facts that matter — including one HONESTY correction (2026-08-26
# review): v0.0.31 launches its helper pods with spec.nodeName set directly,
# which bypasses the scheduler, and kubelet admission does not enforce
# NoSchedule taints. So helper pods run on any target node REGARDLESS of
# tolerations — tolerations here are future-proofing for an upstream move to
# scheduled helpers, not the operating fence. The REAL fence keeping volumes
# off vast-owned / mid-transition nodes is volumeBindingMode:
# WaitForFirstConsumer — a volume is only ever created where a CONSUMER pod
# scheduled, and consumer pods are repelled by those taints (plus the
# owner-gate admission policy). Facts:
#   - the provisioner deployment runs on the head node; short-lived helper
#     pods do the mkdir/rm on the target node (via nodeName, above).
#   - the arise.ai/direct-owned toleration uses operator: Exists so it also
#     matches the controller's value=true taint if upstream ever schedules
#     helpers; a DIRECT customer's PVCs must provision on the node they pay for.
#   - storage-system is its own namespace (PSA privileged: helper pods run as
#     root to mkdir/chmod on the host path) rather than platform-system, so
#     the base overlay's NetworkPolicies stay untouched (house rule: promotion
#     never edits shared manifests).
#   - both images digest-pinned, like every image in this repo.
#   - FAIL-CLOSED disk check: kubelet's hostPath DirectoryOrCreate will happily
#     create /raid/arise/volumes on the node's ROOT filesystem if the NVMe
#     RAID is not mounted (head node without /raid, or a DGX booting with a
#     degraded RAID) — tenant data would silently land on the OS disk until it
#     fills. The setup script therefore requires a sentinel file that only
#     node bring-up creates INSIDE the real RAID filesystem
#     (Day-0 runbook: `sudo install -d /raid/arise/volumes &&
#     sudo touch /raid/arise/volumes/.raid-verified` after verifying the RAID
#     mount); a rootfs-created directory lacks it and provisioning errors.
#   - SIZE IS ADMISSION-TIME ONLY: the quantization policy and ResourceQuota
#     bound what a tenant may CLAIM, but local-path enforces no on-disk quota —
#     a tenant can write past its PVC size until the RAID fills. Honest gap,
#     tracked with D2; per-volume enforcement arrives with the real storage
#     pool (or XFS project quotas if D2 lands on local NVMe).
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: storage-system
  labels:
    project: arise-b300
    # privileged for the provisioner's hostPath helper pods; arise-platform-
    # namespace-creators (platform/base) lets only the workload controllers and
    # the provisioner's own ServiceAccount create pods here, never privileged.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner
  namespace: storage-system
  labels: { app.kubernetes.io/name: local-path-provisioner, project: arise-b300 }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arise:local-path-provisioner
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arise:local-path-provisioner
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "arise:local-path-provisioner" }
subjects:
  - { kind: ServiceAccount, name: local-path-provisioner, namespace: storage-system }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: storage-system
  labels: { project: arise-b300 }
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/raid/arise/volumes"]
        }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    # Fail closed if this directory is NOT the verified NVMe RAID: node
    # bring-up creates the sentinel inside the real /raid filesystem (see the
    # header). If kubelet DirectoryOrCreate manufactured this path on the OS
    # disk, the sentinel is absent and we refuse to put tenant data there.
    parent="$(dirname "$VOL_DIR")"
    if [ ! -f "$parent/.raid-verified" ]; then
      echo "REFUSING: $parent lacks .raid-verified — the NVMe RAID is not" \
           "mounted here (or node bring-up never verified it)." >&2
      exit 1
    fi
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
      labels: { project: arise-b300 }
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
        # NOTE: v0.0.31 helper pods bypass the scheduler via spec.nodeName, so
        # tolerations are currently inert (see header). Kept, with
        # operator: Exists so it matches the controller's value=true taint,
        # for the day upstream schedules helpers: a DIRECT customer's volumes
        # must provision on the tainted node they reserved. Deliberately NOT
        # tolerated: arise.ai/vast-owned, arise.ai/transition.
        - key: arise.ai/direct-owned
          operator: Exists
          effect: NoSchedule
      containers:
        - name: helper-pod
          image: busybox@sha256:fc6dddc4c44b1bfe37f41cae8e67d1693828e8f42a91862816d7953e2c9d3f23
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: storage-system
  labels: { app.kubernetes.io/name: local-path-provisioner, project: arise-b300 }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: local-path-provisioner } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: local-path-provisioner, project: arise-b300 }
    spec:
      serviceAccountName: local-path-provisioner
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: local-path-provisioner
          image: rancher/local-path-provisioner@sha256:80496fdeb307541007621959aa13aed41d31db9cd2dc4167c19833e0bfa3878c
          command:
            - local-path-provisioner
            - start
            - --config
            - /etc/config/config.json
            - --service-account-name
            - local-path-provisioner
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/config, readOnly: true }
      volumes:
        - name: config
          configMap: { name: local-path-config }
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: arise-shared
  labels:
    project: arise-b300
  annotations:
    arise.ai/description: >-
      Working storage: scratch, datasets in active use, checkpoints. Deleted
      when the claim is deleted. Day-0 backing: node-local NVMe RAID (/raid);
      NOT yet a cross-node shared filesystem — that is decision D2, and these
      class names are the stable API it will slot into.
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: arise-longterm
  labels:
    project: arise-b300
  annotations:
    arise.ai/description: >-
      Long-term storage: model artifacts, archived datasets. The volume is
      RETAINED after the claim is deleted and needs explicit operator cleanup —
      that friction is the point for data someone may regret deleting.
      Cleanup that FREES the disk: patch the Released PV's reclaimPolicy to
      Delete (the provisioner then runs teardown on the node); deleting the
      PV object alone leaves the directory on /raid (runbooks/incident-disk-full.md).
      Day-0 backing: node-local NVMe RAID (/raid), same D2 caveat as
      arise-shared.
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
