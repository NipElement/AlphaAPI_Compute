# ============================================================================
# Tenant portal — DGX overlay. PORTED FROM overlays/lab/tenant-portal.yaml.
#
# RBAC is byte-identical to the lab's: it is one of the things plan §13.1 says
# transfers unchanged, and UI-02's denial assertions are the proof it earned.
#
# Differences from the lab, all three deliberate:
#   - FAKE_GPU_RESOURCE=nvidia.com/gpu: the portal renders GPU quota/usage for
#     the resource that actually exists on this cluster.
#   - nodeSelector pins to the control-plane/head node: a platform pod left
#     free to land on a GPU worker would survive an ownership drain (drains
#     evict tenant namespaces only) and end up living on a node VAST or a
#     DIRECT customer owns. Infra stays off sellable nodes, structurally.
#   - project label arise-b300 (not -prelab).
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-portal
  namespace: platform-system
  labels: { app.kubernetes.io/name: tenant-portal, project: arise-b300 }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arise:tenant-portal
  namespace: tenant-arise
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arise:tenant-portal
  namespace: tenant-arise
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: arise:tenant-portal }
subjects:
  - { kind: ServiceAccount, name: tenant-portal, namespace: platform-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arise:tenant-portal
  namespace: tenant-direct
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arise:tenant-portal
  namespace: tenant-direct
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: arise:tenant-portal }
subjects:
  - { kind: ServiceAccount, name: tenant-portal, namespace: platform-system }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-portal
  namespace: platform-system
  labels: { app.kubernetes.io/name: tenant-portal, project: arise-b300 }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: tenant-portal } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tenant-portal, project: arise-b300 }
    spec:
      serviceAccountName: tenant-portal
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: portal
          image: PYTHON_BASE_IMAGE_PLACEHOLDER
          command: ["python3", "-u", "/app/tenant_portal.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: FAKE_GPU_RESOURCE, value: "nvidia.com/gpu" }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: tmp,  mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
      volumes:
        - name: code
          configMap: { name: tenant-portal-code }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-portal
  namespace: platform-system
  labels: { app.kubernetes.io/name: tenant-portal }
spec:
  type: ClusterIP        # reached only through the gateway, like the lab
  selector: { app.kubernetes.io/name: tenant-portal }
  ports: [{ name: http, port: 8080, targetPort: http }]
