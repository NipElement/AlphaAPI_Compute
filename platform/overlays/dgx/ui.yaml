# ============================================================================
# Operations console — DGX overlay. PORTED FROM overlays/lab/ui.yaml.
#
# The RBAC is byte-identical to the lab's — the single-writer property it
# encodes (console states intent via NodeOwnership; every gate runs in the
# controller) is exactly what the rehearsal validated. Read it as what this
# identity CANNOT do: patch nodes, patch node status, evict, or delete
# nodeownerships.
#
# Differences from the lab, all three deliberate:
#   - FAKE_GPU_RESOURCE=nvidia.com/gpu: fleet views count real GPUs.
#   - VAST_ADAPTER=none: the console displays the adapter mode; "none" is the
#     truth on day-0 hardware (see deployments.yaml).
#   - nodeSelector pins to the control-plane/head node, keeping infra off
#     sellable GPU nodes (drains evict tenant namespaces only, so an unpinned
#     platform pod would survive onto a VAST/DIRECT-owned node).
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-console
  namespace: platform-system
  labels: { app.kubernetes.io/name: ops-console, project: arise-b300 }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arise:ops-console
rules:
  # Observed state — read only, no exceptions.
  - apiGroups: [""]
    resources: ["nodes", "pods", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Desired state — the console's ONLY write surface. No "delete": removing a
  # NodeOwnership would drop the node out of reconciliation and strand it.
  - apiGroups: ["infrastructure.arise.ai"]
    resources: ["nodeownerships"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["infrastructure.arise.ai"]
    resources: ["nodeownerships/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arise:ops-console
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: arise:ops-console }
subjects:
  - { kind: ServiceAccount, name: ops-console, namespace: platform-system }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-console
  namespace: platform-system
  labels: { app.kubernetes.io/name: ops-console, project: arise-b300 }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: ops-console } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ops-console, project: arise-b300 }
    spec:
      serviceAccountName: ops-console
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: console
          image: PYTHON_BASE_IMAGE_PLACEHOLDER
          command: ["python3", "-u", "/app/console.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: PROMETHEUS_URL, value: "http://prometheus.monitoring.svc:9090" }
            - { name: FAKE_GPU_RESOURCE, value: "nvidia.com/gpu" }
            - { name: VAST_ADAPTER, value: "none" }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: tmp,  mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
      volumes:
        - name: code
          configMap: { name: ops-console-code }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ops-console
  namespace: platform-system
  labels: { app.kubernetes.io/name: ops-console }
spec:
  # ClusterIP only, reached through the gateway. This console can request
  # ownership changes — it is the last thing that should face the internet.
  type: ClusterIP
  selector: { app.kubernetes.io/name: ops-console }
  ports: [{ name: http, port: 8080, targetPort: http }]
