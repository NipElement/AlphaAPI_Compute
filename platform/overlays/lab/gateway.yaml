# ============================================================================
# Platform gateway — the single front door.
#
# NO ServiceAccount powers at all: automountServiceAccountToken false, no
# Role, no ClusterRole. The gateway aggregates four in-cluster HTTP backends
# and nothing else; the portal/console RBAC split survives behind it.
# UI-03 asserts the pod really has no token mounted.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-gateway
  namespace: platform-system
  labels: { app.kubernetes.io/name: platform-gateway, project: arise-b300-prelab }
spec:
  replicas: 1
  # ...and Recreate, which is the other half of that sentence. replicas: 1
  # with the default RollingUpdate + maxSurge 25% rounds UP to one surge pod,
  # so EVERY rollout runs two gateways at once — measured on the live cluster
  # 2026-08-31 (maxSurge=25%). During that window requests land on either
  # pod: a runtime-created account exists on one and not the other, so its
  # login succeeds or fails by coin flip, and an account the admin just
  # deleted still authenticates on the pod that has not been replaced yet.
  # A few seconds of 503 at rollout is the honest trade; sessions survive it
  # because seed credentials are derived deterministically.
  # Upgrading an EXISTING Deployment that was RollingUpdate needs the old
  # sub-field dropped first, or apply fails with "rollingUpdate:
  # Forbidden": kubectl -n platform-system patch deploy platform-gateway
  #   --type=json -p '[{"op":"remove","path":"/spec/strategy/rollingUpdate"}]'
  # A fresh Day-0 install has no prior object and needs nothing.
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: platform-gateway } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: platform-gateway, project: arise-b300-prelab }
    spec:
      automountServiceAccountToken: false
      # Pinned to the control-plane (infra home, never a GPU/tenant node) so the
      # built SPA (web/dist) can be hostPath-mounted from one known node. The
      # dist is too large for a ConfigMap; make code copies it onto this node.
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: PYTHON_BASE_IMAGE_PLACEHOLDER
          command: ["python3", "-u", "/app/gateway.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: WEB_DIR, value: "/srv/web" }
            - { name: GW_AUTH_DB, value: "/var/lib/arise-auth/auth.sqlite3" }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: web,  mountPath: /srv/web, readOnly: true }
            - { name: tmp,  mountPath: /tmp }
            - { name: auth, mountPath: /var/lib/arise-auth }
            - { name: tenants, mountPath: /etc/arise, readOnly: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
      volumes:
        - name: auth
          persistentVolumeClaim: { claimName: platform-gateway-auth }
        - name: code
          configMap: { name: platform-gateway-code }
        - name: tenants
          # Rendered from platform/tenants.yaml by `make code` / `make
          # dgx-code`. optional: a pod that predates the ConfigMap still starts
          # and falls back to its built-in tenant list rather than crash-looping
          # the console.
          configMap: { name: platform-tenants, optional: true }
        - name: web
          hostPath: { path: /arise/web, type: DirectoryOrCreate }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-gateway
  namespace: platform-system
  labels: { app.kubernetes.io/name: platform-gateway }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: platform-gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-gateway-auth
  namespace: platform-system
  labels: { app.kubernetes.io/name: platform-gateway }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: arise-longterm
  resources:
    requests: { storage: 10Gi }
