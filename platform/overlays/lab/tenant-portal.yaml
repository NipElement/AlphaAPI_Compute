# ============================================================================
# Tenant portal — RBAC, workload, service.
#
# RBAC design, read as what this identity CANNOT do:
#   - no ClusterRole at all: its reach is exactly the two tenant namespaces
#   - cannot read or write nodes, NodeOwnership, queues, admission policies
#   - cannot touch platform-system, vast-mock, monitoring
#
# The portal is a WORKLOAD CLIENT. Every request it builds still passes the
# quantization gate, the queue binding, the owner gate and the quotas at the
# API server. A compromised portal can spend a tenant's quota; it cannot move
# a node, list a machine on VAST, or borrow another tenant's entitlement.
# UI-02 asserts each denial with `kubectl auth can-i`.
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-portal
  namespace: platform-system
  labels: { app.kubernetes.io/name: tenant-portal, project: arise-b300-prelab }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arise:tenant-portal
  namespace: tenant-arise
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # A dev machine's SSH authorized_keys rides in a ConfigMap (a PUBLIC key is
  # not a secret, so this widens nothing sensitive). No update: keys are
  # replaced by re-creating the machine, never edited in place.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arise:tenant-portal
  namespace: tenant-arise
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: arise:tenant-portal }
subjects:
  - { kind: ServiceAccount, name: tenant-portal, namespace: platform-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arise:tenant-portal
  namespace: tenant-direct
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # A dev machine's SSH authorized_keys rides in a ConfigMap (a PUBLIC key is
  # not a secret, so this widens nothing sensitive). No update: keys are
  # replaced by re-creating the machine, never edited in place.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arise:tenant-portal
  namespace: tenant-direct
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: arise:tenant-portal }
subjects:
  - { kind: ServiceAccount, name: tenant-portal, namespace: platform-system }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-portal
  namespace: platform-system
  labels: { app.kubernetes.io/name: tenant-portal, project: arise-b300-prelab }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: tenant-portal } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tenant-portal, project: arise-b300-prelab }
    spec:
      serviceAccountName: tenant-portal
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: portal
          image: PYTHON_BASE_IMAGE_PLACEHOLDER
          command: ["python3", "-u", "/app/tenant_portal.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: FAKE_GPU_RESOURCE, value: "arise.dev/fake-gpu" }
            # kind-loaded by `make devbox-image`; imagePullPolicy defaults to
            # IfNotPresent for a tagged image, so the loaded copy is used.
            - { name: DEVBOX_IMAGE, value: "arise/devbox:lab" }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: tmp,  mountPath: /tmp }
            - { name: tenants, mountPath: /etc/arise, readOnly: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
      volumes:
        - name: code
          configMap: { name: tenant-portal-code }
        - name: tmp
          emptyDir: {}
        - name: tenants
          # Rendered from platform/tenants.yaml by `make code` / `make
          # dgx-code`. optional: a pod that predates the ConfigMap still starts
          # and falls back to its built-in tenant list rather than crash-looping
          # the console.
          configMap: { name: platform-tenants, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-portal
  namespace: platform-system
  labels: { app.kubernetes.io/name: tenant-portal }
spec:
  type: ClusterIP        # port-forward only, like every UI here (plan §5.3)
  selector: { app.kubernetes.io/name: tenant-portal }
  ports: [{ name: http, port: 8080, targetPort: http }]
