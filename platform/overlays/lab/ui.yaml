# ============================================================================
# Operations console — RBAC, workload, service.
#
# The RBAC below is the enforcement of the console's one architectural rule.
# Read it as a list of what this identity CANNOT do:
#
#   - it cannot patch nodes            -> cannot set arise.ai/owner
#   - it cannot patch nodes/status     -> cannot invent capacity
#   - it cannot create pods/eviction   -> cannot drain behind the controller
#   - it cannot delete nodeownerships  -> cannot erase desired state to
#                                          "unstick" a node
#
# All it may do is state intent by writing a NodeOwnership spec. Every gate —
# drain, contract, sanitize, health — still runs in the controller. If someone
# later "just needs" node write access here to fix something quickly, that is
# the moment the single-writer property dies; the fix belongs in the
# controller, not in the console's role.
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-console
  namespace: platform-system
  labels: { app.kubernetes.io/name: ops-console, project: arise-b300-prelab }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arise:ops-console
rules:
  # Observed state — read only, no exceptions.
  - apiGroups: [""]
    resources: ["nodes", "pods", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Desired state — the console's ONLY write surface.
  # Note the absence of "delete": removing a NodeOwnership object would drop a
  # node out of reconciliation entirely, which is a way to strand a node in
  # whatever state it happens to be in.
  - apiGroups: ["infrastructure.arise.ai"]
    resources: ["nodeownerships"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["infrastructure.arise.ai"]
    resources: ["nodeownerships/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arise:ops-console
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: arise:ops-console }
subjects:
  - { kind: ServiceAccount, name: ops-console, namespace: platform-system }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-console
  namespace: platform-system
  labels: { app.kubernetes.io/name: ops-console, project: arise-b300-prelab }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: ops-console } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ops-console, project: arise-b300-prelab }
    spec:
      serviceAccountName: ops-console
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: console
          image: PYTHON_BASE_IMAGE_PLACEHOLDER
          command: ["python3", "-u", "/app/console.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: PROMETHEUS_URL, value: "http://prometheus.monitoring.svc:9090" }
            - { name: FAKE_GPU_RESOURCE, value: "arise.dev/fake-gpu" }
            - { name: VAST_ADAPTER, value: "mock-v1" }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: tmp,  mountPath: /tmp }
            - { name: tenants, mountPath: /etc/arise, readOnly: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
      volumes:
        - name: code
          configMap: { name: ops-console-code }
        - name: tmp
          emptyDir: {}
        - name: tenants
          configMap: { name: platform-tenants, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: ops-console
  namespace: platform-system
  labels: { app.kubernetes.io/name: ops-console }
spec:
  # ClusterIP only. Reached via `kubectl port-forward`, or SSM port-forward
  # once SSM is registered. Plan §3.2/§5.3 forbid any public bind, and this
  # console can request ownership changes — it is the last thing that should
  # be reachable from the internet.
  type: ClusterIP
  selector: { app.kubernetes.io/name: ops-console }
  ports: [{ name: http, port: 8080, targetPort: http }]
